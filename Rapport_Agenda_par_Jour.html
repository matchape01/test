<html lang="fr">
<head>
<meta charset="UTF-8">

<title>Tantramour 2026 — Planning par Jour</title>
<style>
  :root {
    --bg: #ffffff; --surface: #f7f8fa; --border: #e5e7eb;
    --text: #1f2328; --muted: #57606a; --accent: #3b82d4;
    --header-bg: #f0f4fb; --row-alt: #f7f8fa; --tag-bg: #eef2ff; --tag-text: #3b5bdb;
    --badge-h: #e0f2fe; --badge-ht: #0369a1;
    --badge-a: #fce7f3; --badge-at: #9d174d;
    --badge-f: #dcfce7; --badge-ft: #166534;
  }
  .dark {
    --bg: #0d1117; --surface: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
    --header-bg: #1c2333; --row-alt: #161b22; --tag-bg: #1c2a4a; --tag-text: #79a8ff;
    --badge-h: #0c2d48; --badge-ht: #58a6ff;
    --badge-a: #3b1030; --badge-at: #f0abca;
    --badge-f: #0a2e1a; --badge-ft: #4ade80;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system,"Segoe UI",system-ui,sans-serif; font-size: 14px; line-height: 1.6; background: var(--bg); color: var(--text); transition: background .2s, color .2s; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 24px 20px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
  .logo { display: flex; flex-direction: column; }
  .logo h1 { font-size: 20px; font-weight: 700; letter-spacing: .3px; }
  .logo p { font-size: 28px; font-weight: 800; color: var(--accent); letter-spacing: .3px; line-height: 1.2; margin-top: 2px; }
  .header-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .mode-btn { cursor: pointer; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 14px; font-size: 13px; color: var(--text); font-family: inherit; transition: background .15s; }
  .mode-btn:hover { background: var(--border); }
  .filters { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; align-items: flex-end; }
  .filter-group { display: flex; flex-direction: column; gap: 4px; }
  .filter-group label { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 600; }
  select { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; font-size: 13px; color: var(--text); font-family: inherit; min-width: 200px; cursor: pointer; }
  .stats { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .stats span { color: var(--accent); font-weight: 600; }
  /* ── TABLE VIEW ── */
  .table-wrap { width: 100%; overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  /* Largeurs fixes — sans colonne Date, noms sur plusieurs lignes */
  col.c-jour   { width: 48px; }
  col.c-date   { width: 100px; }
  col.c-heure  { width: 108px; }
  col.c-type   { width: 118px; }
  col.c-atelier{ width: 190px; }
  col.c-piment { width: 42px; }
  col.c-lieu   { width: 76px; }
  col.c-fac    { width: 160px; }
  col.c-trad   { width: 90px; }
  col.c-helper { width: 180px; }
  col.c-angel  { width: 110px; }
  col.c-edit   { width: 30px; }
  thead th { background: var(--header-bg); padding: 7px 8px; text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); border-bottom: 1px solid var(--border); white-space: nowrap; cursor: pointer; user-select: none; position: sticky; top: 0; z-index: 1; overflow: hidden; text-overflow: ellipsis; }
  thead th:hover { color: var(--accent); }
  thead th .sort-icon { display: inline-block; margin-left: 3px; opacity: .5; font-size: 9px; }
  thead th.sorted .sort-icon { opacity: 1; color: var(--accent); }
  tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--row-alt); }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:nth-child(even):hover { filter: brightness(.97); }
  tbody tr.conflict-row { background: #fff0f3 !important; }
  tbody tr.conflict-row:hover { background: #ffe0e8 !important; }
  td { padding: 6px 8px; font-size: 12px; vertical-align: top; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.td-wrap { white-space: normal; }
  /* Colonnes où les noms doivent pouvoir passer à la ligne */
  td.td-names { white-space: normal; overflow: visible; }
  td.td-names .pill { display: block; margin: 1px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Colonne Piment — centrée */
  td.td-piment, th.th-piment { text-align: center; }
  td.conflict-cell { background: #fef08a !important; }
  td.conflict-cell .pill, td.conflict-cell span.pill { background: #fef08a !important; color: #b91c1c !important; font-weight: 700 !important; border: 1px solid #f59e0b; }
  td.conflict-cell-text { background: #fef08a !important; color: #b91c1c !important; font-weight: 700 !important; }
  /* ── CARD VIEW ── */
  .card-list { display: none; flex-direction: column; gap: 20px; }
  /* Groupe jour */
  .card-day-group { display: flex; flex-direction: column; gap: 8px; }
  .card-day-header { font-size: 15px; font-weight: 700; color: var(--text); padding: 10px 14px; background: var(--header-bg); border: 1px solid var(--border); border-radius: 10px; }
  .card-day-sub { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 6px; }
  /* Bloc de groupe visuel (par type) */
  .vg-block { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .vg-header { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .vg-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); flex: 1; }
  .vg-angel { font-size: 11px; font-weight: 600; color: var(--badge-at); background: var(--badge-a); border-radius: 4px; padding: 2px 8px; white-space: nowrap; }
  .vg-angel-tel { font-size: 10px; font-weight: 400; opacity: .8; }
  /* Rangée de mini-cartes */
  .vg-cards { display: flex; flex-direction: row; }
  .vg-cards .mini-card:not(:last-child) { border-right: 1px solid var(--border); }
  /* Mini-carte individuelle */
  .mini-card { flex: 1; min-width: 0; background: var(--bg); padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
  .mini-card-heure { font-size: 11px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .mini-card-prep { font-size: 10px; color: var(--muted); }
  .mini-card-title { font-size: 12px; font-weight: 700; color: var(--text); line-height: 1.3; }
  .mini-card-meta { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
  .mini-card-rows { display: flex; flex-direction: column; gap: 3px; margin-top: 4px; }
  .mini-card-row { display: flex; gap: 5px; align-items: flex-start; }
  .mini-card-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .3px; color: var(--muted); font-weight: 600; min-width: 58px; padding-top: 2px; flex-shrink: 0; }
  .mini-card-val { font-size: 11px; color: var(--text); flex: 1; display: flex; flex-wrap: wrap; gap: 3px; align-items: center; line-height: 1.4; }
  /* Ligne discrète (repas, réunion, prépa) */
  .vg-small { padding: 4px 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
  .vg-small-lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
  .vg-small-items { font-size: 11px; color: var(--muted); }
  /* ── SHARED ── */
  .tag { display: inline-block; background: var(--tag-bg); color: var(--tag-text); border-radius: 4px; padding: 2px 7px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .pill { display: inline-block; border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 600; margin: 1px 2px; white-space: nowrap; }
  .pill-h { background: var(--badge-h); color: var(--badge-ht); }
  .pill-a { background: var(--badge-a); color: var(--badge-at); }
  .pill-f { background: var(--badge-f); color: var(--badge-ft); }
  .pill-t { background: var(--tag-bg); color: var(--tag-text); }
  .heure { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .empty { text-align: center; padding: 48px; color: var(--muted); font-size: 14px; }
  footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--border); text-align: center; font-size: 12px; color: var(--muted); }
  /* ── RESPONSIVE AUTO-SWITCH ── */
  @media (max-width: 767px) {
    .wrap { padding: 16px 12px; }
    select { min-width: 100%; }
    .filters { gap: 10px; }
  }
</style>

<script>
loadData(['data.js', 'logistics.js'], function() {
// RAW : chaque entrée est augmentée d'une propriété _idx = index dans AGENDA
const RAW = AGENDA.map((e, i) => {
  const r = [
    e.jour, e.date, e.heure, e.type, e.atelier, e.lieu,
    e.fac1, e.fac2, e.traduction,
    e.helper1, e.helper2, e.helper3, e.helper4 || '',
    e.angel, e.note, e.logisticId || '', e.piment || 0,
    e.fac3 || '', e.fac4 || ''
  ];
  r._idx = i; // index stable dans AGENDA
  return r;
});

// ─── Détection des conflits (même logique que Rapport4) ──────────────────────
function parseIntervalle(h) {
  if (!h) return null;
  const norm = h.replace(/\./g, ':').replace(/â€"|–|—/g, '-');
  const m = norm.match(/(\d{1,2}):(\d{2})\s*[-–—]+\s*(\d{1,2}):(\d{2})/);
  if (!m) return null;
  const debut = parseInt(m[1]) * 60 + parseInt(m[2]);
  let fin     = parseInt(m[3]) * 60 + parseInt(m[4]);
  if (fin <= debut) fin += 24 * 60;
  return [debut, fin];
}
function chevauche(a, b) { return a && b && a[0] < b[1] && b[0] < a[1]; }

// Retourne une Map : "atelier||jour" → Set de noms en conflit + leurs rôles
// et un Set de clés "atelier||jour" ayant au moins un conflit
function buildConflictIndex() {
  // parPersonne : nom → [{atelier, jour, heure, iv, role, field}]
  const parPersonne = new Map();
  AGENDA.forEach(e => {
    const iv = parseIntervalle(e.heure);
    if (!iv) return;
    const add = (nom, role, field) => {
      if (!nom) return;
      if (!parPersonne.has(nom)) parPersonne.set(nom, []);
      parPersonne.get(nom).push({ atelier: e.atelier, jour: e.jour, heure: e.heure, iv, role, field });
    };
    add(e.fac1,       'Animateur', 'fac1');
    add(e.fac2,       'Animateur', 'fac2');
    add(e.fac3,       'Animateur', 'fac3');
    add(e.fac4,       'Animateur', 'fac4');
    add(e.traduction, 'Traducteur',   'traduction');
    add(e.helper1,    'Helper',       'helper1');
    add(e.helper2,    'Helper',       'helper2');
    add(e.helper3,    'Helper',       'helper3');
    add(e.helper4,    'Helper',       'helper4');
    add(e.angel,      'Angel',        'angel');
  });

  // conflictFields : "atelier||jour" → Set de champs (fac1, helper2...) en conflit
  const conflictFields = new Map(); // clé → Set<field>

  parPersonne.forEach((slots, nom) => {
    const parJour = new Map();
    slots.forEach(s => {
      if (!parJour.has(s.jour)) parJour.set(s.jour, []);
      parJour.get(s.jour).push(s);
    });
    parJour.forEach(daySlots => {
      for (let i = 0; i < daySlots.length; i++) {
        for (let j = i + 1; j < daySlots.length; j++) {
          const a = daySlots[i], b = daySlots[j];
          if (a.role === 'Angel' && b.role === 'Angel') continue;
          if (chevauche(a.iv, b.iv)) {
            // Marquer les deux ateliers impliqués
            [[a.atelier, a.jour, a.field], [b.atelier, b.jour, b.field]].forEach(([at, jr, fld]) => {
              const k = `${at}||${jr}`;
              if (!conflictFields.has(k)) conflictFields.set(k, new Set());
              conflictFields.get(k).add(fld);
            });
          }
        }
      }
    });
  });

  return conflictFields;
}

const CONFLICT_INDEX = buildConflictIndex();

// ─── Set des animateurs anglophones ───────────────────────────────────────
const ANGLOPHONES = new Set(
  (typeof REF_RESSOURCES !== 'undefined' ? REF_RESSOURCES : [])
    .filter(r => r.roles && r.roles.indexOf('anglophone') !== -1)
    .map(r => r.value)
);
function isAnglophone(nom) { return nom && ANGLOPHONES.has(nom); }
function hasAnglophoneFac(r) { return isAnglophone(r[6]) || isAnglophone(r[7]); }

// Retourne le Set de champs en conflit pour une ligne RAW (ou null)
function getConflictFields(r) {
  const k = `${r[4]}||${r[0]}`; // atelier||jour
  return CONFLICT_INDEX.get(k) || null;
}

// Peupler le filtre Type
const types = [...new Set(RAW.map(r=>r[3]).filter(Boolean))].sort();
const selType = document.getElementById('filterType');
types.forEach(t => { const o=document.createElement('option'); o.value=t; o.text=t; selType.appendChild(o); });

// Peupler le filtre Lieu depuis REF_LIEUX (seulement les lieux présents dans les données)
const lieuxPresents = new Set(RAW.map(r=>r[5]).filter(Boolean));
const selLieu = document.getElementById('filterLieu');
REF_LIEUX.filter(l => lieuxPresents.has(l.value)).forEach(l => {
  const o=document.createElement('option'); o.value=l.value; o.text=l.label||l.value; selLieu.appendChild(o);
});

// Peupler le filtre Animateur depuis REF_ANIMATEURS (seulement ceux présents dans les données)

let sortCol = -1, sortAsc = true;

function getFiltered() {
  const j = document.getElementById('filterJour').value;
  const t = document.getElementById('filterType').value;
  const l = document.getElementById('filterLieu').value;
  const f = document.getElementById('filterFac').value;
  const tr = document.getElementById('filterTrad').value;
  const h = document.getElementById('filterHelper').value;
  const a = document.getElementById('filterAngel').value;
  return RAW.filter(r =>
    (!j  || r[0]===j) &&
    (!t  || r[3]===t) &&
    (!l  || r[5]===l) &&
    (!f  || r[6]===f || r[7]===f) &&
    (!tr || r[8]===tr) &&
    (!h  || r[9]===h || r[10]===h || r[11]===h || r[12]===h) &&
    (!a  || r[13]===a)
  );
}

function sortBy(col) {
  if(sortCol===col) sortAsc=!sortAsc; else { sortCol=col; sortAsc=true; }
  // Réinitialiser toutes les icônes de tri présentes dans le thead
  document.querySelectorAll('.sort-icon').forEach(el => {
    el.textContent = '⇅';
    el.parentElement.classList.remove('sorted');
  });
  const si=document.getElementById('si'+col);
  if(si){ si.textContent=sortAsc?'↑':'↓'; si.parentElement.classList.add('sorted'); }
  render();
}

function getVal(row, col) {
  switch(col){
    case 0: return row[0]; case 1: return row[1]; case 2: return row[2]; case 3: return row[3];
    case 4: return row[4]; case 5: return row[5];
    case 6: return [row[6],row[7]].filter(Boolean).join(' / ');
    case 7: return row[8];
    case 8: return [row[9],row[10],row[11]].filter(Boolean).join(' / ');
    case 9: return row[12];
    case 10: return String(row[15] || 0);
  }
  return '';
}

function pills(vals, cls) {
  return vals.filter(Boolean).map(v=>`<span class="pill ${cls}">${v}</span>`).join('');
}

let isMobileView = window.innerWidth < 768;

// Convertit une heure texte en minutes pour le tri (ex: "11:15 - 13:00" → 675)
// Les heures floues ("Matin", "APRES MIDI") sont renvoyées en fin de liste
function heureEnMinutes(h) {
  if (!h) return 9999;
  const norm = h.replace(/\./g, ':');
  const m = norm.match(/(\d{1,2}):(\d{2})/);
  return m ? parseInt(m[1]) * 60 + parseInt(m[2]) : 9999;
}

function render() {
  let data = getFiltered();
  if(sortCol>=0) {
    data = [...data].sort((a,b)=>{
      const av=getVal(a,sortCol)||'', bv=getVal(b,sortCol)||'';
      return sortAsc ? av.localeCompare(bv,'fr') : bv.localeCompare(av,'fr');
    });
  } else {
    // Tri par défaut : jour (ordre naturel) puis heure de début
    const JOUR_ORDER = ['Jour 1','Jour 2','Jour 3','Jour 4','Jour 5','Jour 6','Jour 7'];
    data = [...data].sort((a,b) => {
      const dj = JOUR_ORDER.indexOf(a[0]) - JOUR_ORDER.indexOf(b[0]);
      return dj !== 0 ? dj : heureEnMinutes(a[2]) - heureEnMinutes(b[2]);
    });
  }
  document.getElementById('stats').innerHTML = `<span>${data.length}</span> ${I18n.t('stats_ateliers')}`;
  if (isMobileView) {
    renderCards(data);
  } else {
    renderTable(data);
  }
}

// Champs RAW → colonne tableau (index colonne → champ(s) de l'entrée AGENDA)
const COL_FIELDS = {
  6: ['fac1','fac2','fac3','fac4'],
  7: ['traduction'],
  8: ['helper1','helper2','helper3','helper4'],
  9: ['angel'],
};

function renderTable(data) {
  const tb = document.getElementById('tbody');
  if(!data.length) { tb.innerHTML=`<tr><td colspan="11" class="empty">Aucun résultat</td></tr>`; return; }
  tb.innerHTML = data.map(r => {
    const cf = getConflictFields(r);
    const rowCls = cf ? ' class="conflict-row"' : '';

    // Classe conflit sur une cellule td-names
    const ccNames = (colIdx) => {
      if (!cf) return ' class="td-names"';
      const fields = COL_FIELDS[colIdx] || [];
      return fields.some(f => cf.has(f)) ? ' class="td-names conflict-cell"' : ' class="td-names"';
    };

    // Pills avec wrapping vertical, conflit éventuel
    const pillsNames = (vals, fields, cls) => vals.map((v, i) => {
      if (!v) return '';
      const inConflict = cf && cf.has(fields[i]);
      return inConflict
        ? `<span class="pill ${cls}" style="background:#fef08a;color:#b91c1c;font-weight:700;border:1px solid #f59e0b">${v}</span>`
        : `<span class="pill ${cls}">${v}</span>`;
    }).join('');

    const piment = parseInt(r[16]) || 0;
    const pimentHtml = piment > 0 ? '🌶️'.repeat(piment) : '';

    const realIdx = r._idx !== undefined ? r._idx : 0;
    const enBadge = hasAnglophoneFac(r) ? '<span title="Atelier anglophone" style="font-size:11px;margin-left:5px">🇬🇧</span>' : '';

    // Traducteur avec conflit éventuel
    const tradHtml = r[8]
      ? `<span class="pill pill-t"${cf&&cf.has('traduction')?' style="background:#fef08a;color:#b91c1c;font-weight:700;border:1px solid #f59e0b"':''}>${r[8]}</span>`
      : '';

    // Angel avec conflit éventuel
    const angelHtml = r[13]
      ? `<span class="pill pill-a"${cf&&cf.has('angel')?' style="background:#fef08a;color:#b91c1c;font-weight:700;border:1px solid #f59e0b"':''}>${r[13]}</span>`
      : '';

    return `<tr${rowCls}>
      <td>${r[0]||''}</td>
      <td>${r[1]||''}</td>
      <td class="heure">${r[2]||''}</td>
      <td><span class="tag" style="font-size:10px">${r[3]||''}</span></td>
      <td class="td-wrap">${r[4]||''}${enBadge}${r[14]?'<span style="color:#e53e3e;font-weight:700;margin-left:3px">*</span>':''}</td>
      <td class="td-piment">${pimentHtml}</td>
      <td>${r[5]||''}</td>
      <td${ccNames(6)}>${pillsNames([r[6],r[7],r[17],r[18]],['fac1','fac2','fac3','fac4'],'pill-f')}</td>
      <td class="td-names">${tradHtml}</td>
      <td${ccNames(8)}>${pillsNames([r[9],r[10],r[11],r[12]],['helper1','helper2','helper3','helper4'],'pill-h')}</td>
      <td class="td-names">${angelHtml}</td>
    </tr>`;
  }).join('');
}

// Extrait l'heure de début pour trier (ex: "9:45 - 11:00" → 9*60+45=585)
function parseHeure(h) {
  if (!h) return 9999;
  const m = h.match(/(\d+)[:.h](\d+)/);
  return m ? parseInt(m[1])*60 + parseInt(m[2]) : 9999;
}

// Convertit une heure texte "H:MM" en minutes depuis minuit pour les calculs
function heureMinutes(h) {
  if (!h) return null;
  const m = String(h).replace(/\./g,':').match(/(\d{1,2}):(\d{2})/);
  return m ? parseInt(m[1])*60 + parseInt(m[2]) : null;
}
// Formate un nombre de minutes en "H:MM"
function minutesToHeure(mins) {
  if (mins == null || mins < 0) return '';
  const h = Math.floor(mins / 60) % 24;
  const m = mins % 60;
  return h + ':' + (m < 10 ? '0' : '') + m;
}

// ── Lookup téléphone d'un angel depuis REF_RESSOURCES ──────────────────────
function angelTel(nom) {
  if (!nom || typeof REF_RESSOURCES === 'undefined') return '';
  const r = REF_RESSOURCES.find(x => x.value === nom);
  return (r && r.tel) ? r.tel : '';
}

// ── Construit une mini-carte atelier ───────────────────────────────────────
function buildMiniCard(r) {
  const enBadge = hasAnglophoneFac(r) ? ' <span title="Anglophone" style="font-size:11px">🇬🇧</span>' : '';
  const lieu    = r[5] ? `<span class="tag" style="font-size:10px">${r[5]}</span>` : '';
  const facs    = pills([r[6],r[7]],'pill-f');
  const trad    = r[8]  ? `<span class="pill pill-t">${r[8]}</span>` : '';
  const helpers = pills([r[9],r[10],r[11],r[12]],'pill-h');

  // Heure + prep
  const logId  = r[15];
  const logE   = logId && typeof LOGISTICS !== 'undefined' ? LOGISTICS[logId] : null;
  const prepMin = logE && logE.prepDuration != null ? logE.prepDuration : null;
  const debut   = heureMinutes(r[2]);
  const arrivee = (debut !== null && prepMin !== null) ? minutesToHeure(debut - prepMin) : '';
  const heureHtml = r[2] ? `<div class="mini-card-heure">${r[2]}${prepMin !== null ? `<span class="mini-card-prep"> ⏱${prepMin}mn${arrivee?' ↑'+arrivee:''}</span>` : ''}</div>` : '';

  const rows = [];
  if (facs)    rows.push(`<div class="mini-card-row"><span class="mini-card-lbl">Fac.</span><span class="mini-card-val">${facs}</span></div>`);
  if (trad)    rows.push(`<div class="mini-card-row"><span class="mini-card-lbl">Trad.</span><span class="mini-card-val">${trad}</span></div>`);
  if (helpers) rows.push(`<div class="mini-card-row"><span class="mini-card-lbl">Helpers</span><span class="mini-card-val">${helpers}</span></div>`);
  if (r[14])   rows.push(`<div class="mini-card-row"><span class="mini-card-lbl">Note</span><span class="mini-card-val" style="color:#e53e3e;font-size:10px">${r[14]}</span></div>`);

  return `<div class="mini-card">
    ${heureHtml}
    <div class="mini-card-title">${r[4]||'—'}${enBadge}</div>
    <div class="mini-card-meta">${lieu}</div>
    ${rows.length ? `<div class="mini-card-rows">${rows.join('')}</div>` : ''}
  </div>`;
}

// ── Construit un bloc visuel (header + rangée de mini-cartes) ──────────────
function buildVgBlock(title, items, angelRow) {
  const angelHtml = angelRow
    ? `<span class="vg-angel">👼 ${angelRow.nom}${angelRow.tel ? `<span class="vg-angel-tel"> · ${angelRow.tel}</span>` : ''}</span>`
    : '';
  return `<div class="vg-block">
    <div class="vg-header"><span class="vg-title">${title}</span>${angelHtml}</div>
    <div class="vg-cards">${items.map(buildMiniCard).join('')}</div>
  </div>`;
}

// ── Construit une ligne discrète (repas, réunion d'équipe, prépa) ──────────
function buildSmallLine(emoji, label, items) {
  const txt = items.map(r => r[4]).filter(Boolean).join(' · ');
  return `<div class="vg-small"><span class="vg-small-lbl">${emoji} ${label}</span><span class="vg-small-items">${txt||'—'}</span></div>`;
}

function renderCards(data) {
  const cv = document.getElementById('cardView');
  if (!data.length) { cv.innerHTML=`<div class="empty">Aucun résultat</div>`; return; }

  const DAY_ORDER = ['Jour 1','Jour 2','Jour 3','Jour 4','Jour 5','Jour 6','Jour 7'];

  // Grouper par jour
  const dayMap = new Map();
  data.forEach(r => {
    if (!dayMap.has(r[0])) dayMap.set(r[0], { jour: r[0], date: r[1], items: [] });
    dayMap.get(r[0]).items.push(r);
  });
  dayMap.forEach(g => g.items.sort((a,b) => parseHeure(a[2]) - parseHeure(b[2])));
  const groups = DAY_ORDER.filter(j => dayMap.has(j)).map(j => dayMap.get(j));

  // ── Ordre des groupes visuels ────────────────────────────────────────────
  // Chaque entrée : { key, types[], label, mode }
  //   mode = 'cards'  → mini-cartes côte à côte (avec angel)
  //   mode = 'small'  → ligne discrète
  //   mode = 'group'  → regroupe plusieurs types en petite ligne (prepa+rassemblement)
  const VG_ORDER = [
    { key:'yoga',        types:['MEDITATION / YOGA'],                                    label:'🧘 Méditation / Yoga',          mode:'cards'  },
    { key:'ptdej',       types:['REPAS & PAUSE'],         heureMax: 11*60,               label:'Petit déjeuner',                mode:'small'  },
    { key:'reunion_am',  types:["REUNION D'EQUIPE"],      heureMax: 11*60,               label:'Réunion d\'équipe',             mode:'small'  },
    { key:'prepa_rass',  types:['PREPA & LOGISTICS','RASSEMBLEMENT'], heureMax: 12*60,   label:'🎯 Préparation & Rassemblement', mode:'cards'  },
    { key:'tantra_am',   types:['ATELIERS TANTRA (Matin)','TANTRA CAFE & CONFERENCE'],   label:'🌀 Ateliers Tantra – Matin',    mode:'cards', withAngel:'AM' },
    { key:'art_am',      types:['ATELIER ARTISTIQUE (Matin)','TANTRA CAFE & CONFERENCE'],label:'🎨 Ateliers Artistiques – Matin',mode:'cards', withAngel:'AM' },
    { key:'dejeuner',    types:['REPAS & PAUSE'],         heureMin: 11*60, heureMax:15*60,label:'Déjeuner',                     mode:'small'  },
    { key:'support',     types:['SUPPORT EMOTIONNEL'],                                   label:'💙 Support Émotionnel',         mode:'cards'  },
    { key:'pool_cafe_am',types:['DJ Set','POOL PARTY','TANTRA CAFE & CONFERENCE'], heureMin:12*60, heureMax:16*60, label:'Pool Party / Tantra Café', mode:'cards' },
    { key:'tantra_pm',   types:['ATELIERS TANTRA (Apres-Midi)','TANTRA CAFE & CONFERENCE'], heureMin:14*60, label:'🌀 Ateliers Tantra – Après-midi', mode:'cards', withAngel:'PM' },
    { key:'art_pm',      types:['ATELIER ARTISTIQUE (Apres-Midi)','TANTRA CAFE & CONFERENCE'], heureMin:14*60, label:'🎨 Ateliers Artistiques – Après-midi', mode:'cards', withAngel:'PM' },
    { key:'gouter_dinner',types:['REPAS & PAUSE'],        heureMin: 15*60,               label:'Dîner / Goûter',               mode:'small'  },
    { key:'prepa_soir',  types:['PREPA & LOGISTICS'],     heureMin: 18*60,               label:'Prépa & Logistique – Soir',    mode:'small'  },
    { key:'reunion_pm',  types:["REUNION D'EQUIPE"],      heureMin: 11*60,               label:'Réunion d\'équipe',            mode:'small'  },
    { key:'soir',        types:['CEREMONIE & CONCERT','LOVE TEMPLE','DJ Set','POOL PARTY'], heureMin:18*60, label:'🌙 Soirée', mode:'cards'  },
  ];

  cv.innerHTML = groups.map(g => {
    const items = g.items;

    // Index les SHIFT ANGEL par shift (AM / PM / Soir)
    const angelByShift = {};
    items.filter(r => r[3] === 'SHIFT ANGEL').forEach(r => {
      const atName = (r[4]||'').toLowerCase();
      const shift  = atName.includes('matin') || atName.includes('am')  ? 'AM'
                   : atName.includes('pm')    || atName.includes('midi') || atName.includes('apr') ? 'PM'
                   : 'Soir';
      if (!angelByShift[shift] && r[13]) {
        angelByShift[shift] = { nom: r[13], tel: angelTel(r[13]) };
      }
    });

    // Tracker pour ne pas afficher deux fois le même atelier
    const used = new Set();
    const markUsed = arr => arr.forEach(r => used.add(r));

    // Filtre selon types + fenêtre horaire + non-déjà-utilisé
    const pick = (types, opts) => {
      opts = opts || {};
      return items.filter(r => {
        if (used.has(r)) return false;
        if (!types.includes(r[3])) return false;
        const hm = heureMinutes(r[2]) ?? 9999;
        if (opts.heureMin !== undefined && hm < opts.heureMin) return false;
        if (opts.heureMax !== undefined && hm >= opts.heureMax) return false;
        return true;
      });
    };

    const blocks = [];

    VG_ORDER.forEach(vg => {
      const rows = pick(vg.types, vg);
      if (!rows.length) return;
      markUsed(rows);

      if (vg.mode === 'small') {
        blocks.push(buildSmallLine('', vg.label, rows));
      } else {
        const angel = vg.withAngel ? (angelByShift[vg.withAngel] || null) : null;
        blocks.push(buildVgBlock(vg.label, rows, angel));
      }
    });

    // Résidus non capturés → un bloc générique
    const leftover = items.filter(r => !used.has(r) && r[3] !== 'SHIFT ANGEL');
    if (leftover.length) {
      blocks.push(buildVgBlock('Autres', leftover, null));
    }

    const nb = items.filter(r => r[3] !== 'SHIFT ANGEL').length;
    return `<div class="card-day-group">
      <div class="card-day-header">${g.jour}<span class="card-day-sub"> — ${g.date}</span><span class="card-day-sub"> (${nb} atelier${nb>1?'s':''})</span></div>
      ${blocks.join('')}
    </div>`;
  }).join('');
}

// EXPORT XLSX (SpreadsheetML — pur navigateur)
// ════════════════════════════════════════════════
function exportXlsx() {
  // ── Données filtrées triées comme à l'écran ──────────────────────────────
  let data = getFiltered();
  const JOUR_ORDER = ['Jour 1','Jour 2','Jour 3','Jour 4','Jour 5','Jour 6','Jour 7'];
  data = [...data].sort((a, b) => {
    const dj = JOUR_ORDER.indexOf(a[0]) - JOUR_ORDER.indexOf(b[0]);
    return dj !== 0 ? dj : heureEnMinutes(a[2]) - heureEnMinutes(b[2]);
  });

  // ── Colonnes ────────────────────────────────────────────────────────────
  const HEADERS = ['Jour','Date','Heure','Type','Atelier','Piment','Lieu',
                   'Animateur 1','Animateur 2','Animateur 3','Animateur 4','Traducteur',
                   'Helper 1','Helper 2','Helper 3','Helper 4','Angel','Note'];

  // ── Helpers XML ─────────────────────────────────────────────────────────
  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&apos;');
  }

  // Convertit un numéro de colonne (0-based) en lettre(s) Excel : 0→A, 25→Z, 26→AA
  function colLetter(n) {
    let s = '';
    n++;
    while (n > 0) { n--; s = String.fromCharCode(65 + (n % 26)) + s; n = Math.floor(n / 26); }
    return s;
  }

  function cellRef(col, row) { return colLetter(col) + row; }

  // Cellule texte
  function cellS(col, row, val) {
    return `<c r="${cellRef(col, row)}" t="inlineStr"><is><t>${esc(val)}</t></is></c>`;
  }

  // ── Construction des lignes XML ──────────────────────────────────────────
  let rowsXml = '';

  // En-tête (ligne 1)
  rowsXml += `<row r="1">`;
  HEADERS.forEach((h, ci) => { rowsXml += cellS(ci, 1, h); });
  rowsXml += `</row>`;

  // Données (à partir de la ligne 2)
  data.forEach((r, ri) => {
    const rowNum = ri + 2;
    // r = [jour, date, heure, type, atelier, lieu, fac1, fac2, trad, h1, h2, h3, h4, angel, note, logisticId, piment, fac3, fac4]
    const vals = [r[0],r[1],r[2],r[3],r[4], r[16]||0, r[5],r[6],r[7],r[17]||'',r[18]||'',r[8],r[9],r[10],r[11],r[12],r[13],r[14]];
    rowsXml += `<row r="${rowNum}">`;
    vals.forEach((v, ci) => { rowsXml += cellS(ci, rowNum, v == null ? '' : v); });
    rowsXml += `</row>`;
  });

  // ── Calcul des largeurs de colonnes ─────────────────────────────────────
  const colWidths = HEADERS.map((h, ci) => {
    const maxLen = data.reduce((m, r) => {
      const vals = [r[0],r[1],r[2],r[3],r[4], r[16]||0, r[5],r[6],r[7],r[8],r[9],r[10],r[11],r[12],r[13],r[14]];
      return Math.max(m, String(vals[ci] == null ? '' : vals[ci]).length);
    }, h.length);
    return Math.min(Math.max(maxLen + 2, 10), 60);
  });
  const colsXml = colWidths.map((w, ci) =>
    `<col min="${ci+1}" max="${ci+1}" width="${w}" customWidth="1"/>`
  ).join('');

  // ── Assemblage du fichier XLSX (ZIP SpreadsheetML minimal) ───────────────
  // Nom de fichier reflétant les filtres actifs
  const fj  = document.getElementById('filterJour').value;
  const ft  = document.getElementById('filterType').value;
  const fileName = ['TantramourAgenda', fj||'TousJours', ft||''].filter(Boolean).join('_') + '.xlsx';

  // Contenu des fichiers internes du ZIP XLSX
  const sheetXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
  <sheetViews><sheetView tabSelected="1" workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>
  <cols>${colsXml}</cols>
  <sheetData>${rowsXml}</sheetData>
  <autoFilter ref="A1:${colLetter(HEADERS.length - 1)}1"/>
</worksheet>`;

  const workbookXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"
          xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
  <sheets><sheet name="Agenda" sheetId="1" r:id="rId1"/></sheets>
</workbook>`;

  const relsWorkbook = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>
</Relationships>`;

  const relsRoot = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`;

  const contentTypes = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml"  ContentType="application/xml"/>
  <Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
  <Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>
</Types>`;

  // ── Construction du ZIP en JavaScript pur ────────────────────────────────
  // Implémentation minimale du format ZIP (Local File Header + Central Directory)
  function strToBytes(str) {
    const enc = new TextEncoder();
    return enc.encode(str);
  }

  function crc32(bytes) {
    const table = (() => {
      const t = new Uint32Array(256);
      for (let i = 0; i < 256; i++) {
        let c = i;
        for (let j = 0; j < 8; j++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        t[i] = c;
      }
      return t;
    })();
    let crc = 0xFFFFFFFF;
    for (const b of bytes) crc = table[(crc ^ b) & 0xFF] ^ (crc >>> 8);
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }

  function uint16LE(n) { return [n & 0xFF, (n >> 8) & 0xFF]; }
  function uint32LE(n) { return [n & 0xFF, (n >> 8) & 0xFF, (n >> 16) & 0xFF, (n >> 24) & 0xFF]; }

  function makeZipEntry(name, content) {
    const nameBytes    = strToBytes(name);
    const contentBytes = strToBytes(content);
    const crc          = crc32(contentBytes);
    const size         = contentBytes.length;
    const date = 0x5765; // 2026-xx-xx (valeur arbitraire)
    const time = 0x0000;

    // Local file header
    const localHeader = [
      0x50, 0x4B, 0x03, 0x04,   // signature
      ...uint16LE(20),           // version needed
      ...uint16LE(0),            // flags
      ...uint16LE(0),            // compression (stored)
      ...uint16LE(time),
      ...uint16LE(date),
      ...uint32LE(crc),
      ...uint32LE(size),
      ...uint32LE(size),
      ...uint16LE(nameBytes.length),
      ...uint16LE(0),            // extra length
      ...nameBytes,
    ];

    return {
      name, nameBytes, crc, size, date, time,
      localOffset: 0, // sera rempli lors de l'assemblage
      localHeader: new Uint8Array(localHeader),
      content: contentBytes,
    };
  }

  function buildZip(entries) {
    // Calculer les offsets
    let offset = 0;
    entries.forEach(e => {
      e.localOffset = offset;
      offset += e.localHeader.length + e.content.length;
    });

    const centralDirOffset = offset;

    // Central directory entries
    const centralParts = entries.map(e => {
      const cd = [
        0x50, 0x4B, 0x01, 0x02,
        ...uint16LE(20), ...uint16LE(20),
        ...uint16LE(0), ...uint16LE(0),
        ...uint16LE(e.time), ...uint16LE(e.date),
        ...uint32LE(e.crc),
        ...uint32LE(e.size), ...uint32LE(e.size),
        ...uint16LE(e.nameBytes.length),
        ...uint16LE(0), ...uint16LE(0),
        ...uint16LE(0), ...uint16LE(0),
        ...uint32LE(0),
        ...uint32LE(e.localOffset),
        ...e.nameBytes,
      ];
      return new Uint8Array(cd);
    });

    const centralDirSize = centralParts.reduce((s, p) => s + p.length, 0);

    // End of central directory
    const eocd = new Uint8Array([
      0x50, 0x4B, 0x05, 0x06,
      ...uint16LE(0), ...uint16LE(0),
      ...uint16LE(entries.length), ...uint16LE(entries.length),
      ...uint32LE(centralDirSize),
      ...uint32LE(centralDirOffset),
      ...uint16LE(0),
    ]);

    // Assembler tout
    const totalSize = offset + centralDirSize + eocd.length;
    const buf = new Uint8Array(totalSize);
    let pos = 0;
    entries.forEach(e => {
      buf.set(e.localHeader, pos); pos += e.localHeader.length;
      buf.set(e.content, pos);     pos += e.content.length;
    });
    centralParts.forEach(p => { buf.set(p, pos); pos += p.length; });
    buf.set(eocd, pos);
    return buf;
  }

  // ── Assembler les fichiers du XLSX ───────────────────────────────────────
  const entries = [
    makeZipEntry('[Content_Types].xml',          contentTypes),
    makeZipEntry('_rels/.rels',                   relsRoot),
    makeZipEntry('xl/workbook.xml',               workbookXml),
    makeZipEntry('xl/_rels/workbook.xml.rels',    relsWorkbook),
    makeZipEntry('xl/worksheets/sheet1.xml',      sheetXml),
  ];

  const zipBytes = buildZip(entries);

  // ── Téléchargement ───────────────────────────────────────────────────────
  const blob = new Blob([zipBytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = fileName;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Exposer dans window les fonctions appelées depuis les onclick HTML
window.hardReload    = hardReload;
window.toggleMode    = toggleMode;
window.toggleView    = toggleView;
window.setView       = setView;
window.sortBy        = sortBy;
window.render        = render;
window.exportXlsx    = exportXlsx;
window.openEditPw    = openEditPw;
window.closeEditPw   = closeEditPw;
window.checkEditPw   = checkEditPw;

}); // fin loadData
</script>
</body>
</html>

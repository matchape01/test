<script>
loadData(['ref_ressources.js', 'data.js'], function() {

// ════════════════════════════════════════════════
// CONFIGURATION
// ════════════════════════════════════════════════
// Types d'ateliers pris en compte (exclut repas, prep, réunions internes)
const TYPES_ACTIFS = new Set([
  'ATELIERS TANTRA (Matin)', 'ATELIERS TANTRA (Apres-Midi)',
  'ATELIER ARTISTIQUE (Matin)', 'ATELIER ARTISTIQUE (Apres-Midi)',
  'MEDITATION / YOGA', 'RASSEMBLEMENT',
  'CEREMONIE & CONCERT',
  'LOVE TEMPLE', 'SUPPORT EMOTIONNEL',
  'DJ Set', 'POOL PARTY',
  'TANTRA CAFE', 'CONFERENCE',
  'PREPA & LOGISTICS',
  'REUNION',                        // ateliers de type réunion (helpers, trads, angels)
  'SHIFT ANGEL',                    // nécessaire pour grouper les ateliers par shift angel
]);

function typeActif(type) {
  return type ? TYPES_ACTIFS.has(type) : false;
}

const JOUR_ORDER = ['Jour 1','Jour 2','Jour 3','Jour 4','Jour 5','Jour 6','Jour 7'];

let currentTab = 's'; // 'h' = helpers, 'a' = angels, 't' = trad, 's' = combined

// ════════════════════════════════════════════════
// PARSING HEURE → minutes depuis minuit
// ════════════════════════════════════════════════
function parseMinutes(str) {
  if (!str) return null;
  const s = String(str).replace(/\./g, ':').trim();
  const m = s.match(/(\d{1,2}):(\d{2})/);
  if (!m) return null;
  return parseInt(m[1]) * 60 + parseInt(m[2]);
}

function parseDuration(heure) {
  if (!heure) return 0;
  const norm = String(heure).replace(/\./g, ':');
  const parts = norm.split(/\s*[-–—]\s*/);
  if (parts.length < 2) return 0;
  let start = parseMinutes(parts[0]);
  let end   = parseMinutes(parts[1]);
  if (start === null || end === null) return 0;
  if (end < start) end += 24 * 60; // passe minuit
  return end - start;
}

// Convertit une heure "11:15 - 13:00" en intervalle {s, e} en minutes
function parseInterval(heure) {
  if (!heure) return null;
  const norm = String(heure).replace(/\./g, ':');
  const parts = norm.split(/\s*[-–—]\s*/);
  if (parts.length < 2) return null;
  let s = parseMinutes(parts[0]);
  let e = parseMinutes(parts[1]);
  if (s === null || e === null) return null;
  if (e < s) e += 24 * 60;
  return { s, e };
}

// ════════════════════════════════════════════════
// CALCUL DES STATS PAR PERSONNE
// ════════════════════════════════════════════════
function buildStats(jourFilter) {
  const filtered = AGENDA.filter(e =>
    typeActif(e.type) &&
    (jourFilter === '' || e.jour === jourFilter)
  );

  // Helpers exclus des moyennes (mais toujours affichés) :
  // ceux qui ont aussi un rôle colibri, manager ou admin dans REF_RESSOURCES
  const EXCLUDED_ROLES = new Set(['colibri', 'manager', 'admin']);
  const HELPERS_EXCLUS = new Set(
    (typeof REF_RESSOURCES !== 'undefined' ? REF_RESSOURCES : [])
      .filter(r => r.roles.includes('helper') && r.roles.some(role => EXCLUDED_ROLES.has(role)))
      .map(r => r.value)
  );

  // Map nom → { assignments: [{atelier, jour, heure, type, role}], ... }
  const helpers = {};
  const angels  = {};
  const trads   = {};

  function addTo(map, nom, entry) {
    if (!nom) return;
    if (!map[nom]) map[nom] = [];
    map[nom].push(entry);
  }

  // Helpers et traducteurs : filtrés par TYPES_ACTIFS (pas de repas, réunions, etc.)
  filtered.forEach(e => {
    const base = { atelier: e.atelier, jour: e.jour, heure: e.heure, type: e.type, date: e.date };
    addTo(helpers, e.helper1,    { ...base, role: 'Helper' });
    addTo(helpers, e.helper2,    { ...base, role: 'Helper' });
    addTo(helpers, e.helper3,    { ...base, role: 'Helper' });
    addTo(helpers, e.helper4,    { ...base, role: 'Helper' });
    addTo(trads,   e.traduction, { ...base, role: 'Traducteur' });
  });

  // Angels : collectés depuis TOUTES les entrées du jour (sans filtre typeActif),
  // sauf les types sans intérêt pour la charge de travail.
  const ANGEL_TYPES_EXCLUS = new Set(['REPAS & PAUSE', 'PREPA & LOGISTICS', "REUNION D'EQUIPE"]);
  const allForAngel = AGENDA.filter(e =>
    (jourFilter === '' || e.jour === jourFilter) &&
    !ANGEL_TYPES_EXCLUS.has(e.type)
  );
  allForAngel.forEach(e => {
    const base = { atelier: e.atelier, jour: e.jour, heure: e.heure, type: e.type, date: e.date };
    addTo(angels, e.angel, { ...base, role: 'Angel' });
  });

  // Pour les angels : fusion des intervalles qui se chevauchent (interval merging)
  // Règle : si deux créneaux se chevauchent ou sont consécutifs sur le même jour,
  //         on ne compte que l'union (durée la plus longue / plage couverte).
  // Exemple : 11:15-13:00 + 11:15-13:30 + 12:00-13:30 → 1 seul créneau 11:15-13:30

  // Fusionne une liste d'intervalles {s,e} et retourne la somme des durées nettes
  function mergeIntervals(intervals) {
    if (!intervals.length) return 0;
    const sorted = intervals.slice().sort((a, b) => a.s - b.s);
    const merged = [{ ...sorted[0] }];
    for (let i = 1; i < sorted.length; i++) {
      const last = merged[merged.length - 1];
      if (sorted[i].s <= last.e) {
        // Chevauchement ou contigu → étendre si nécessaire
        last.e = Math.max(last.e, sorted[i].e);
      } else {
        merged.push({ ...sorted[i] });
      }
    }
    return merged.reduce((sum, iv) => sum + (iv.e - iv.s), 0);
  }

  function computeAngelStats(assignments) {
    // Grouper par jour
    const byDay = {};
    assignments.forEach(a => {
      if (!byDay[a.jour]) byDay[a.jour] = [];
      byDay[a.jour].push(a);
    });

    let totalMin    = 0;
    let uniqueSlots = 0;

    // Pour chaque jour : calculer les intervalles fusionnés (interval merging)
    // et construire un Set des clés "s|e" déjà vus pour marquer les doublons
    const seenPerDay = {}; // jour → Set de clés "s|e" déjà comptées

    const deduped = assignments.map(a => {
      const iv = parseInterval(a.heure);
      if (!iv) return { ...a, isDupe: false };

      const key = `${a.jour}||${iv.s}|${iv.e}`;
      if (!seenPerDay[a.jour]) seenPerDay[a.jour] = new Set();

      // Premier passage sur ce créneau exact → pas un doublon d'affichage
      // Mais la durée réelle sera calculée via merging plus bas
      const isDupe = seenPerDay[a.jour].has(`${iv.s}|${iv.e}`);
      seenPerDay[a.jour].add(`${iv.s}|${iv.e}`);

      // Marquer aussi si ce créneau est contenu dans un plus long du même jour
      if (!isDupe) {
        const siblings = byDay[a.jour]
          .map(b => parseInterval(b.heure))
          .filter(Boolean);
        const isCoveredByLarger = siblings.some(other =>
          other.s <= iv.s && other.e >= iv.e &&
          (other.e - other.s) > (iv.e - iv.s)
        );
        return { ...a, isDupe: isCoveredByLarger };
      }

      return { ...a, isDupe: true };
    });

    // Durée nette par jour via interval merging (gère doublons et chevauchements)
    Object.entries(byDay).forEach(([jour, dayAssignments]) => {
      const intervals = dayAssignments.map(a => parseInterval(a.heure)).filter(Boolean);
      if (!intervals.length) return;

      const sorted = intervals.slice().sort((a, b) => a.s - b.s);
      const merged = [{ ...sorted[0] }];
      for (let i = 1; i < sorted.length; i++) {
        const last = merged[merged.length - 1];
        if (sorted[i].s <= last.e) {
          last.e = Math.max(last.e, sorted[i].e); // fusion
        } else {
          merged.push({ ...sorted[i] });
        }
      }
      totalMin    += merged.reduce((sum, iv) => sum + (iv.e - iv.s), 0);
      uniqueSlots += merged.length;
    });

    return { assignments: deduped, count: uniqueSlots, minutes: totalMin };
  }

  function computeHelperStats(assignments) {
    return {
      assignments,
      count:   assignments.length,
      minutes: assignments.reduce((s, a) => s + parseDuration(a.heure), 0)
    };
  }

  const helperStats = Object.entries(helpers).map(([nom, list]) => ({
    nom, role: 'Helper', ...computeHelperStats(list)
  })).sort((a, b) => b.minutes - a.minutes || b.count - a.count);

  const angelStats = Object.entries(angels).map(([nom, list]) => ({
    nom, role: 'Angel', ...computeAngelStats(list)
  })).sort((a, b) => b.minutes - a.minutes || b.count - a.count);

  // Les traducteurs utilisent la même règle de déduplication que les angels
  // (même créneau simultané = compté une seule fois)
  const tradStats = Object.entries(trads).map(([nom, list]) => ({
    nom, role: 'Traducteur', ...computeAngelStats(list)
  })).sort((a, b) => b.minutes - a.minutes || b.count - a.count);

  return { helperStats, angelStats, tradStats, helpersExclus: HELPERS_EXCLUS };
}

// ════════════════════════════════════════════════
// AFFICHAGE
// ════════════════════════════════════════════════
function fmtMin(min) {
  if (!min) return '—';
  const h = Math.floor(min / 60);
  const m = min % 60;
  return h + 'h' + (m ? String(m).padStart(2, '0') : '');
}

function loadBar(count, max) {
  const pct = max ? Math.round((count / max) * 100) : 0;
  const cls = pct < 40 ? 'low' : pct < 70 ? 'medium' : 'high';
  return `<div class="load-bar-wrap"><div class="load-bar ${cls}" style="width:${pct}%"></div></div>`;
}

function renderPersonCard(person, rank, max, roleOverride) {
  const role = roleOverride || person.role;
  // Rôles distincts pour l'en-tête (gère les multi-rôles "Helper + Angel + Traducteur")
  const ROLE_BADGE_CLS = { 'Helper': 'badge-h', 'Angel': 'badge-a', 'Traducteur': 'badge-t' };
  const roleList = role ? role.split(' + ').map(r => r.trim()) : [role];
  const headerBadges = roleList.map(r =>
    `<span class="person-role-badge ${ROLE_BADGE_CLS[r] || 'badge-b'}">${r}</span>`
  ).join('');
  const badgeCls = ROLE_BADGE_CLS[roleList[0]] || 'badge-b';
  const statCls  = roleList[0] === 'Helper' ? 'h' : roleList[0] === 'Traducteur' ? 't' : 'a';
  const id = 'card-' + person.nom.replace(/\W/g, '_');

  // Grouper les ateliers par jour
  const byDay = {};
  person.assignments.forEach(a => {
    if (!byDay[a.jour]) byDay[a.jour] = [];
    byDay[a.jour].push(a);
  });

  // Rendu d'un atelier sous forme de bloc coloré selon le rôle
  function rowHtml(a) {
    const dur = parseDuration(a.heure);
    const fmtDur = dur && !a.isDupe ? fmtMin(dur) : null;
    const dupeHtml = a.isDupe ? ` <span class="detail-dedupe">${I18n.t('r6_deduplique')}</span>` : '';

    // Déterminer le rôle effectif de cette ligne (pour vue combinée, a.role peut varier)
    const r = a.role || role;
    const isHelper = r === 'Helper';
    const isTrad   = r === 'Traducteur';
    const isAngel  = r === 'Angel';

    if (isHelper) {
      return `<div class="helper-row-block">
        <div class="helper-row-header">
          <span class="role-row-badge badge-h" style="flex-shrink:0">Helper</span>
          <span class="helper-row-label">${a.atelier}${dupeHtml}</span>
          <span class="helper-row-heure">${a.heure || '—'}</span>
          ${fmtDur ? `<span class="helper-row-dur">${fmtDur}</span>` : ''}
        </div>
      </div>`;
    }
    if (isTrad) {
      return `<div class="trad-row-block">
        <div class="trad-row-header">
          <span class="role-row-badge badge-t" style="flex-shrink:0">Traducteur</span>
          <span class="trad-row-label">${a.atelier}${dupeHtml}</span>
          <span class="trad-row-heure">${a.heure || '—'}</span>
          ${fmtDur ? `<span class="trad-row-dur">${fmtDur}</span>` : ''}
        </div>
      </div>`;
    }
    if (isAngel) {
      return `<div class="angel-shift-block">
        <div class="angel-shift-header">
          <span class="role-row-badge badge-a" style="flex-shrink:0">Angel</span>
          <span class="angel-shift-label">${a.atelier}${dupeHtml}</span>
          <span class="angel-shift-heure">${a.heure || '—'}</span>
          ${fmtDur ? `<span class="angel-shift-dur">${fmtDur}</span>` : ''}
        </div>
      </div>`;
    }
    // Fallback multi-rôle inconnu
    return `<div class="helper-row-block">
      <div class="helper-row-header">
        <span class="role-row-badge ${badgeCls}" style="flex-shrink:0">${r}</span>
        <span class="helper-row-label">${a.atelier}${dupeHtml}</span>
        <span class="helper-row-heure">${a.heure || '—'}</span>
        ${fmtDur ? `<span class="helper-row-dur">${fmtDur}</span>` : ''}
      </div>
    </div>`;
  }

  const detailHtml = JOUR_ORDER
    .filter(j => byDay[j])
    .map(j => {
      // Calculer la durée nette du jour (interval merging) pour l'afficher
      const dayIntervals = byDay[j]
        .map(a => parseInterval(a.heure)).filter(Boolean)
        .sort((a, b) => a.s - b.s);
      const merged = [];
      dayIntervals.forEach(iv => {
        const last = merged[merged.length - 1];
        if (last && iv.s <= last.e) { last.e = Math.max(last.e, iv.e); }
        else merged.push({ ...iv });
      });
      const dayMin = merged.reduce((s, iv) => s + (iv.e - iv.s), 0);

      // Tri chronologique pour tout le jour
      const sorted = byDay[j].slice().sort((a, b) => {
        const sa = parseInterval(a.heure); const sb = parseInterval(b.heure);
        return (sa ? sa.s : 9999) - (sb ? sb.s : 9999);
      });

      let bodyHtml;

      // Le rendu shift s'active si la personne a des SHIFT ANGEL ce jour-là
      // (fonctionne aussi en vue combinée où role peut être "Helper + Angel")
      const hasShifts = sorted.some(a => a.type === 'SHIFT ANGEL');

      if (hasShifts) {
        // ── Rendu spécial Angels : ordre chronologique global ──
        // Les shifts angel contiennent les ateliers couverts indentés juste dessous,
        // les ateliers hors-shift sont intercalés à leur position chronologique naturelle.
        const shifts   = sorted.filter(a => a.type === 'SHIFT ANGEL');
        const ateliers = sorted.filter(a => a.type !== 'SHIFT ANGEL');

        // Source étendue : tous les ateliers du jour depuis AGENDA (pas seulement ceux de cet angel)
        const AGENDA_SHIFT_EXCLUS = new Set(['REPAS & PAUSE', 'PREPA & LOGISTICS', "REUNION D'EQUIPE", 'SHIFT ANGEL']);
        const allDayEntries = AGENDA.filter(e =>
          e.jour === j &&
          !AGENDA_SHIFT_EXCLUS.has(e.type)
        );

        // Rendu d'une ligne atelier indentée sous un shift
        function shiftRowHtml(a) {
          const dur = parseDuration(a.heure);
          const angelLabel = (a.angel && a.angel !== person.nom)
            ? `<span style="font-size:10px;color:var(--muted);margin-left:4px;">(${I18n.t('r6_angel_label')} ${a.angel})</span>`
            : '';
          return `<div class="angel-shift-atelier-row">
            <span class="detail-heure">${a.heure || '—'}</span>
            <span class="detail-atelier">${a.atelier}${angelLabel}</span>
            ${dur ? `<span class="detail-dur">${fmtMin(dur)}</span>` : ''}
          </div>`;
        }

        // Construire un bloc HTML pour un shift angel et ses ateliers couverts
        function shiftBlockHtml(sh) {
          const shIv = parseInterval(sh.heure);
          const inside = shIv
            ? allDayEntries.filter(a => {
                const aIv = parseInterval(a.heure);
                return aIv && aIv.s >= shIv.s && aIv.s < shIv.e;
              }).sort((a, b) => {
                const aIv = parseInterval(a.heure);
                const bIv = parseInterval(b.heure);
                if (aIv && bIv && aIv.s !== bIv.s) return aIv.s - bIv.s;
                return (a.atelier || '').localeCompare(b.atelier || '', 'fr', { sensitivity: 'base' });
              })
            : [];
          const shDur = shIv ? fmtMin(shIv.e - shIv.s) : '';
          const shiftId = 'sh-' + id + '-' + j.replace(/\W/g,'_') + '-' + (shIv ? shIv.s : Math.random().toString(36).slice(2));
          const nbAteliers = inside.length;
          return `<div class="angel-shift-block" id="${shiftId}">
            <div class="angel-shift-header" onclick="toggleShift('${shiftId}')">
              <span class="role-row-badge badge-a" style="flex-shrink:0">Angel</span>
              <span class="angel-shift-label">${sh.atelier || I18n.t('r6_shift_angel')}</span>
              <span class="angel-shift-heure">${sh.heure || '—'}</span>
              ${shDur ? `<span class="angel-shift-dur">${shDur}</span>` : ''}
              ${nbAteliers ? `<span class="angel-shift-dur" style="margin-left:2px">${nbAteliers} atelier${nbAteliers > 1 ? 's' : ''}</span>` : ''}
              <span class="angel-shift-chevron">▾</span>
            </div>
            <div class="angel-shift-ateliers">
              ${inside.length
                ? inside.map(shiftRowHtml).join('')
                : `<div style="padding:6px 14px;font-size:12px;color:var(--muted);font-style:italic">${I18n.t('r6_aucun_atelier_creneau')}</div>`}
            </div>
          </div>`;
        }

        // Déterminer si un atelier est couvert par un shift
        function isCoveredByShift(a) {
          const aIv = parseInterval(a.heure);
          if (!aIv) return false;
          return shifts.some(sh => {
            const shIv = parseInterval(sh.heure);
            return shIv && aIv.s >= shIv.s && aIv.s < shIv.e;
          });
        }

        // Construire la séquence chronologique globale :
        // - ateliers hors-shift : affichés à leur position naturelle (rowHtml)
        // - shifts : affichés à leur position + ateliers couverts indentés juste dessous
        const freeAteliers = ateliers.filter(a => !isCoveredByShift(a));

        // Mélanger shifts + ateliers libres dans l'ordre chrono
        const anchors = [...shifts, ...freeAteliers].sort((a, b) => {
          const sa = parseInterval(a.heure); const sb = parseInterval(b.heure);
          return (sa ? sa.s : 9999) - (sb ? sb.s : 9999);
        });

        bodyHtml = anchors.map(a =>
          a.type === 'SHIFT ANGEL' ? shiftBlockHtml(a) : rowHtml(a)
        ).join('');
      } else {
        // ── Rendu standard (Helpers / Traducteurs) ──
        bodyHtml = sorted.map(rowHtml).join('');
      }

      const dayId = 'day-' + id + '-' + j.replace(/\W/g, '_');
      // Rôles uniques du jour
      const dayRoles = [...new Set(byDay[j].map(a => a.role).filter(Boolean))];
      const ROLE_BADGE = { 'Helper': 'badge-h', 'Angel': 'badge-a', 'Traducteur': 'badge-t' };
      const dayRoleBadges = dayRoles.map(r =>
        `<span class="role-row-badge ${ROLE_BADGE[r] || 'badge-b'}">${r}</span>`
      ).join('');
      // Pour les Angels (et traducteurs) : compter les blocs temporels fusionnés du jour,
      // pas le nombre brut d'assignments (un shift qui couvre plusieurs ateliers simultanés = 1 seul bloc)
      const isAngelOrTrad = byDay[j].every(a => a.role === 'Angel' || a.role === 'Traducteur');
      let nbJour;
      if (isAngelOrTrad && merged.length > 0) {
        nbJour = merged.length; // nombre de blocs temporels distincts après interval merging
      } else {
        nbJour = byDay[j].filter(a => {
          // Pour les angels en vue combinée, exclure les ateliers couverts par un shift
          if (a.role === 'Angel' || a.role === 'Traducteur') {
            const aIv = parseInterval(a.heure);
            if (!aIv) return true;
            // Exclure si ce créneau est strictement contenu dans un plus long du même jour
            return !byDay[j].some(other => {
              if (other === a) return false;
              const oIv = parseInterval(other.heure);
              return oIv && oIv.s <= aIv.s && oIv.e >= aIv.e && (oIv.e - oIv.s) > (aIv.e - aIv.s);
            });
          }
          return true;
        }).length;
      }
      return `<div class="detail-day" id="${dayId}">
        <div class="detail-day-label" onclick="toggleDay('${dayId}')">
          <span class="detail-day-label-text">${j} — ${byDay[j][0].date}</span>
          ${dayRoleBadges}
          ${dayMin ? `<span class="day-dur-badge">${fmtMin(dayMin)} ${role === 'Angel' ? I18n.t('r6_comptabilise_net') : I18n.t('r6_comptabilise')}</span>` : ''}
          <span class="angel-shift-dur" style="background:var(--muted)">${nbJour} ${nbJour > 1 ? I18n.t('r6_ateliers_pl') : I18n.t('r6_atelier')}</span>
          <span class="detail-day-chevron">▾</span>
        </div>
        <div class="detail-day-body">
          ${bodyHtml}
        </div>
      </div>`;
    }).join('');

  return `
    <div class="person-card" id="${id}">
      <div class="person-header" onclick="toggleDetail('${id}')">
        <div class="person-rank">#${rank}</div>
        <div class="person-name">${person.nom}</div>
        ${headerBadges}
        <div class="person-stats">
          <div class="stat-block">
            <div class="stat-num ${statCls}">${person.count}</div>
            <div class="stat-lbl" data-i18n="r6_ateliers">ateliers</div>
            ${loadBar(person.count, max)}
          </div>
          <div class="stat-block">
            <div class="stat-num ${statCls}">${fmtMin(person.minutes)}</div>
            <div class="stat-lbl" data-i18n="r6_duree_totale">durée totale</div>
          </div>
        </div>
        <span style="color:rgba(255,255,255,.6);font-size:16px;margin-left:8px;">▾</span>
      </div>
      <div class="person-detail" id="detail-${id}">
        ${detailHtml}
      </div>
    </div>`;
}

function toggleDetail(id) {
  const d = document.getElementById('detail-' + id);
  if (d) d.classList.toggle('open');
}

function toggleDay(dayId) {
  const el = document.getElementById(dayId);
  if (el) el.classList.toggle('open');
}

// ════════════════════════════════════════════════
// HARMONISATION
// ════════════════════════════════════════════════
function buildHarmony(helperStats, angelStats, tradStats, helpersExclus) {
  const cards = [];
  const _helpersExclus = helpersExclus || new Set();

  // Personnes exclues des suggestions de redistribution (animateurs, personnes non substituables)
  const EXCLUDED_FROM_SUGGESTIONS = new Set([
    'Amana (William Duplain)',
    'Paul Raj Amar',
    'David Llorca',
    "Sophie O'Heix",
    'Sevda Duroy',
    'TEST',
  ]);

  // Helpers actifs (non exclus, ayant au moins une affectation)
  // Exclut aussi les colibri/manager/admin (même règle que la summary bar)
  const helperActifs = helperStats.filter(p => !EXCLUDED_FROM_SUGGESTIONS.has(p.nom) && !_helpersExclus.has(p.nom) && p.minutes > 0);
  const angelActifs  = angelStats.filter(p  => !EXCLUDED_FROM_SUGGESTIONS.has(p.nom) && p.minutes > 0);
  const tradActifs   = tradStats.filter(p   => !EXCLUDED_FROM_SUGGESTIONS.has(p.nom) && p.minutes > 0);

  const AVG_H_min = helperActifs.reduce((s, p) => s + p.minutes, 0) / (helperActifs.length || 1);
  const AVG_A_min = angelActifs.reduce((s,  p) => s + p.minutes, 0) / (angelActifs.length  || 1);
  const AVG_T_min = tradActifs.reduce((s,   p) => s + p.minutes, 0) / (tradActifs.length   || 1);
  const AVG_H = helperActifs.reduce((s, p) => s + p.count, 0) / (helperActifs.length || 1);
  const AVG_A = angelActifs.reduce((s,  p) => s + p.count, 0) / (angelActifs.length || 1);
  const AVG_T = tradActifs.reduce((s,   p) => s + p.count, 0) / (tradActifs.length  || 1);
  const MAX_H = helperActifs.length ? helperActifs[0].count : 0;
  const MIN_H = helperActifs.length ? helperActifs[helperActifs.length - 1].count : 0;
  const MAX_A = angelActifs.length  ? angelActifs[0].count  : 0;
  const MIN_A = angelActifs.length  ? angelActifs[angelActifs.length - 1].count  : 0;
  const MAX_T = tradActifs.length   ? tradActifs[0].count   : 0;
  const MIN_T = tradActifs.length   ? tradActifs[tradActifs.length - 1].count    : 0;

  // ── Charge globale par personne (toutes catégories confondues) ──────────────
  const globalLoad = {}; // nom → { count: total, minutes: total, roles: [] }
  const addGlobal = (list, role) => list.forEach(p => {
    if (!globalLoad[p.nom]) globalLoad[p.nom] = { nom: p.nom, count: 0, minutes: 0, roles: [] };
    globalLoad[p.nom].count   += p.count;
    globalLoad[p.nom].minutes += p.minutes;
    globalLoad[p.nom].roles.push(role);
  });
  addGlobal(helperStats,  'Helper');
  addGlobal(angelStats,   'Angel');
  addGlobal(tradStats,    'Traducteur');

  const allGlobal = Object.values(globalLoad);
  // Pour la moyenne, exclure les personnes non substituables ET les colibri/manager/admin
  const allGlobalForAvg = allGlobal.filter(p => !EXCLUDED_FROM_SUGGESTIONS.has(p.nom) && !_helpersExclus.has(p.nom));
  const AVG_GLOBAL = allGlobalForAvg.reduce((s, p) => s + p.count, 0) / (allGlobalForAvg.length || 1);
  const AVG_GLOBAL_min = allGlobalForAvg.reduce((s, p) => s + p.minutes, 0) / (allGlobalForAvg.length || 1);

  function globalNote(nom) {
    const g = globalLoad[nom];
    if (!g || g.roles.length <= 1) return '';
    return ` <em style="font-size:11px;color:var(--muted);">(${I18n.t('r6_charge_globale')} ${g.count} ${I18n.t('r6_ateliers')} — ${g.roles.join(' + ')})</em>`;
  }

  // ════════════════════════════════════════════════
  // CARTE −1 : Objectif d'équilibre par catégorie
  // tag: 'global' → visible dans la vue globale ET dans chaque vue par rôle
  // ════════════════════════════════════════════════
  {
    function buildCatRow(label, statList, avg_min, colorVar) {
      if (!statList.length) return '';
      const actifs = statList.filter(p => !EXCLUDED_FROM_SUGGESTIONS.has(p.nom) && p.minutes > 0);
      if (!actifs.length) return '';
      const sorted = actifs.slice().sort((a, b) => b.minutes - a.minutes);
      const rows = sorted.map(p => {
        const diff = p.minutes - avg_min;
        const pct  = avg_min > 0 ? Math.round(p.minutes / avg_min * 100) : 0;
        const barW = Math.min(Math.round(p.minutes / avg_min * 80), 160);
        let barColor = '#16a34a';
        if (pct > 140) barColor = '#dc2626';
        else if (pct > 115) barColor = '#f59e0b';
        else if (pct < 50)  barColor = '#9333ea';
        else if (pct < 75)  barColor = '#3b82f6';
        const diffStr = diff >= 0
          ? `<span style="color:#dc2626;font-size:11px">+${fmtMin(Math.round(Math.abs(diff)))}</span>`
          : `<span style="color:#16a34a;font-size:11px">−${fmtMin(Math.round(Math.abs(diff)))}</span>`;
        return `<tr>
          <td style="font-weight:600">${p.nom}</td>
          <td style="text-align:center"><strong style="color:${colorVar}">${fmtMin(p.minutes)}</strong></td>
          <td style="text-align:center">${pct}%</td>
          <td>${diffStr}</td>
          <td><div style="background:${barColor};height:7px;border-radius:3px;width:${barW}px;max-width:160px"></div></td>
        </tr>`;
      }).join('');
      const lo = fmtMin(Math.round(avg_min * 0.8));
      const hi = fmtMin(Math.round(avg_min * 1.2));
      return `
        <tr style="background:var(--surface)">
          <td colspan="5" style="font-size:12px;font-weight:700;padding:10px 8px 4px;color:${colorVar}">
            ${label} &nbsp;·&nbsp; ${I18n.t('r6_h_moy')} <strong>${fmtMin(Math.round(avg_min))}</strong>
            &nbsp;<span style="font-size:11px;font-weight:400;color:var(--muted)">${I18n.t('r6_h_fourchette')} ${lo} – ${hi}</span>
          </td>
        </tr>
        ${rows}`;
    }

    const hRows = buildCatRow('🤝 Helpers',     helperStats, AVG_H_min, 'var(--helper-text)');
    const aRows = buildCatRow('👼 Angels',      angelStats,  AVG_A_min, 'var(--angel-text)');
    const tRows = buildCatRow('🌐 Traducteurs', tradStats,   AVG_T_min, 'var(--trad-text)');

    if (hRows || aRows || tRows) {
      cards.push({
        cat: 'global',
        cls: '',
        icon: '🎯',
        title: I18n.t('r6_h_objectif_title'),
        body: `
          <p style="font-size:13px;color:var(--muted);margin-bottom:12px">${I18n.t('r6_h_objectif_body')}</p>
          <table class="redist-table" style="margin-top:6px">
            <thead><tr><th>${I18n.t('r6_h_col_nom')}</th><th style="text-align:center">${I18n.t('r6_h_col_heures')}</th><th style="text-align:center">${I18n.t('r6_h_col_pctmoy')}</th><th>${I18n.t('r6_h_col_ecart')}</th><th>${I18n.t('r6_h_col_charge')}</th></tr></thead>
            <tbody>${hRows}${aRows}${tRows}</tbody>
          </table>
          <p style="margin-top:10px;font-size:11px;color:var(--muted);">
            <span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#dc2626;margin-right:4px"></span>${I18n.t('r6_h_legend_overload')}&nbsp;&nbsp;
            <span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#f59e0b;margin-right:4px"></span>${I18n.t('r6_h_legend_above')}&nbsp;&nbsp;
            <span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#16a34a;margin-right:4px"></span>${I18n.t('r6_h_legend_target')}&nbsp;&nbsp;
            <span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#3b82f6;margin-right:4px"></span>${I18n.t('r6_h_legend_below')}&nbsp;&nbsp;
            <span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#9333ea;margin-right:4px"></span>${I18n.t('r6_h_legend_light')}
          </p>`
      });
    }
  }

  // ════════════════════════════════════════════════
  // CARTE 0 : Classement global — tag 'global'
  // ════════════════════════════════════════════════
  {
    // Un seul tableau : toutes les personnes (tous rôles), triées par total décroissant
    const allSorted = allGlobal
      .filter(g => g.minutes > 0)
      .sort((a, b) => b.minutes - a.minutes);

    // Barre de couleur selon écart à la moyenne globale
    function barColor(minutes, avg) {
      const ratio = avg > 0 ? minutes / avg : 0;
      if (ratio > 1.4)  return '#dc2626';
      if (ratio > 1.15) return '#f59e0b';
      if (ratio < 0.5)  return '#9333ea';
      if (ratio < 0.75) return '#3b82f6';
      return '#16a34a';
    }

    // Badges colorés par rôle
    function roleBadge(role) {
      if (role === 'Helper')      return `<span style="font-size:9px;font-weight:700;padding:1px 6px;border-radius:99px;background:var(--helper-bg);color:var(--helper-text);border:1px solid var(--helper-border)">Helper</span>`;
      if (role === 'Angel')       return `<span style="font-size:9px;font-weight:700;padding:1px 6px;border-radius:99px;background:var(--angel-bg);color:var(--angel-text);border:1px solid var(--angel-border)">Angel</span>`;
      if (role === 'Traducteur')  return `<span style="font-size:9px;font-weight:700;padding:1px 6px;border-radius:99px;background:var(--trad-bg);color:var(--trad-text);border:1px solid var(--trad-border)">Trad.</span>`;
      return '';
    }

    const rows = allSorted.map((g, i) => {
      const ratio   = AVG_GLOBAL_min > 0 ? g.minutes / AVG_GLOBAL_min : 0;
      const diff    = g.minutes - AVG_GLOBAL_min;
      const diffStr = diff >= 0
        ? `<span style="color:#dc2626">+${fmtMin(Math.round(Math.abs(diff)))}</span>`
        : `<span style="color:#16a34a">-${fmtMin(Math.round(Math.abs(diff)))}</span>`;
      const barW = Math.min(Math.round(ratio * 60), 120);
      const col  = barColor(g.minutes, AVG_GLOBAL_min);

      // Détail par rôle (ateliers + durée)
      const hP = helperStats.find(x => x.nom === g.nom);
      const aP = angelStats.find(x => x.nom === g.nom);
      const tP = tradStats.find(x => x.nom === g.nom);
      const parts = [];
      if (hP) parts.push(`${hP.count} ${hP.count > 1 ? I18n.t('r6_ateliers_pl') : I18n.t('r6_atelier')} · ${fmtMin(hP.minutes)} ${I18n.t('r6_helper_label')}`);
      if (aP) parts.push(`${aP.count} ${aP.count > 1 ? I18n.t('r6_blocs_uniques') : I18n.t('r6_net')} · ${fmtMin(aP.minutes)} ${I18n.t('r6_angel_role')}`);
      if (tP) parts.push(`${tP.count} ${tP.count > 1 ? I18n.t('r6_ateliers_pl') : I18n.t('r6_atelier')} · ${fmtMin(tP.minutes)} ${I18n.t('r6_trad_label')}`);
      const detail = parts.length > 1
        ? `<br><span style="font-size:10px;color:var(--muted)">${parts.join(' + ')}</span>`
        : `<br><span style="font-size:10px;color:var(--muted)">${parts[0] || ''}</span>`;

      const badges = g.roles.map(roleBadge).join(' ');

      return `<tr>
        <td style="font-weight:700">#${i+1} ${g.nom}</td>
        <td>${badges}</td>
        <td>${g.count}</td>
        <td><strong>${fmtMin(g.minutes)}</strong>${detail}</td>
        <td class="col-heures">${diffStr}</td>
        <td style="min-width:90px;"><div style="background:${col};height:8px;border-radius:4px;width:${barW}px;max-width:120px"></div></td>
      </tr>`;
    }).join('');

    cards.unshift({
      cat: 'global',
      cls: '',
      icon: '📊',
      title: I18n.t('r6_classement_title'),
      body: `
      <div class="avg-bar">
        <div class="avg-pill"><strong style="color:var(--helper-text)">${fmtMin(Math.round(AVG_H_min))}</strong>${I18n.t('r6_moy_helpers')}</div>
        <div class="avg-pill"><strong style="color:var(--angel-text)">${fmtMin(Math.round(AVG_A_min))}</strong>${I18n.t('r6_moy_angels')}</div>
        ${AVG_T_min > 0 ? `<div class="avg-pill"><strong style="color:var(--trad-text)">${fmtMin(Math.round(AVG_T_min))}</strong>${I18n.t('r6_moy_traducteurs')}</div>` : ''}
        <div class="avg-pill"><strong style="color:var(--accent)">${fmtMin(Math.round(AVG_GLOBAL_min))}</strong>${I18n.t('r6_moy_globale')}</div>
      </div>
      <table class="redist-table" style="margin-top:10px">
        <thead><tr><th>${I18n.t('r6_h_col_nom')}</th><th>${I18n.t('r6_col_roles')}</th><th>${I18n.t('r6_col_ateliers')}</th><th>${I18n.t('r6_col_duree')}</th><th>${I18n.t('r6_col_ecart_global')}</th><th>${I18n.t('r6_h_col_charge')}</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <p style="margin-top:10px;font-size:11px;color:var(--muted);">
        <span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#dc2626;margin-right:4px"></span>${I18n.t('r6_h_legend_overload')}&nbsp;&nbsp;
        <span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#f59e0b;margin-right:4px"></span>${I18n.t('r6_h_legend_above')}&nbsp;&nbsp;
        <span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#16a34a;margin-right:4px"></span>${I18n.t('r6_h_legend_target')}&nbsp;&nbsp;
        <span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#3b82f6;margin-right:4px"></span>${I18n.t('r6_h_legend_below')}&nbsp;&nbsp;
        <span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#9333ea;margin-right:4px"></span>${I18n.t('r6_h_legend_light')}
      </p>`
    });
  }

  // ════════════════════════════════════════════════
  // CARTE : Redistribution helpers — suggestions détaillées
  // ════════════════════════════════════════════════
  {
    // Helpers surchargés (> 120% de la moyenne en heures)
    const overloaded = helperActifs.filter(p => p.minutes > AVG_H_min * 1.2 && p.count > 0);
    // Helpers disponibles (< 85% de la moyenne en heures et charge globale raisonnable)
    const available  = helperActifs.filter(p => {
      if (p.minutes >= AVG_H_min * 0.85) return false;
      const g = globalLoad[p.nom];
      return !g || g.minutes <= AVG_GLOBAL_min * 1.3;
    });

    if (overloaded.length) {
      // Construire un index des intervalles par personne
      const intervalsByPerson = {};
      helperStats.forEach(p => {
        intervalsByPerson[p.nom] = p.assignments.map(a => parseInterval(a.heure)).filter(Boolean)
          .map(iv => ({ ...iv, jour: p.assignments.find(a => parseInterval(a.heure)?.s === iv.s)?.jour }));
      });

      // Vérifie si une personne a un conflit horaire sur un créneau donné
      function hasConflict(nom, jour, iv) {
        const p = helperStats.find(x => x.nom === nom);
        if (!p) return false;
        return p.assignments.some(a => {
          if (a.jour !== jour) return false;
          const aiv = parseInterval(a.heure);
          if (!aiv) return false;
          return aiv.s < iv.e && aiv.e > iv.s; // chevauchement
        });
      }

      // Également vérifier les angels
      function hasConflictAngel(nom, jour, iv) {
        const p = angelStats.find(x => x.nom === nom);
        if (!p) return false;
        return p.assignments.some(a => {
          if (a.jour !== jour) return false;
          const aiv = parseInterval(a.heure);
          if (!aiv) return false;
          return aiv.s < iv.e && aiv.e > iv.s;
        });
      }

      const rows = [];
      overloaded.forEach(overP => {
        // Prendre les ateliers les plus longues de cette personne (top 3 redistribuables)
        const ateliersSorted = overP.assignments
          .filter(a => parseDuration(a.heure) >= 60) // ateliers significatifs seulement
          .sort((a, b) => parseDuration(b.heure) - parseDuration(a.heure));

        let transfertCount = 0;
        ateliersSorted.forEach(atelier => {
          if (transfertCount >= 3) return; // max 3 suggestions par personne

          const iv = parseInterval(atelier.heure);
          if (!iv) return;

          // Chercher des remplaçants potentiels parmi TOUS les helpers (pas seulement les available)
          // priorité : ceux en dessous de la moyenne d'abord
          const candidatesAll = helperActifs
            .filter(avP => {
              if (avP.nom === overP.nom) return false;
              if (hasConflict(avP.nom, atelier.jour, iv)) return false;
              if (hasConflictAngel(avP.nom, atelier.jour, iv)) return false;
              return true;
            })
            .sort((a, b) => a.minutes - b.minutes) // les moins chargés en premier
            .slice(0, 4); // max 4 candidats

          if (candidatesAll.length === 0) return;

          transfertCount++;
          const dur = parseDuration(atelier.heure);
          const ecartOver = fmtMin(Math.round(overP.minutes - AVG_H_min));

          // Séparer candidats disponibles (sous la moy.) des autres
          const candUnder = candidatesAll.filter(c => c.minutes < AVG_H_min);
          const candOther = candidatesAll.filter(c => c.minutes >= AVG_H_min);

          const candHtml = [
            ...candUnder.map(c => {
              const gain = fmtMin(Math.round(AVG_H_min - c.minutes));
              return `<span style="color:#16a34a;font-weight:600">${c.nom}</span> <span style="font-size:10px;color:var(--muted)">${fmtMin(c.minutes)} — ${I18n.t('r6_sous_moy_de')} ${gain}</span>`;
            }),
            ...candOther.slice(0, 2).map(c => {
              return `${c.nom} <span style="font-size:10px;color:var(--muted)">${fmtMin(c.minutes)}</span>`;
            })
          ].join('<br>');

          rows.push(`<tr>
            <td class="col-atelier">${atelier.jour}<br><span style="font-weight:400;color:var(--muted);font-size:11px">${atelier.heure}</span></td>
            <td style="font-weight:600">${atelier.atelier}</td>
            <td class="col-actuel">${overP.nom}<br>
              <span style="font-size:10px;font-weight:400;color:var(--muted)">${fmtMin(overP.minutes)} ${I18n.t('r6_total')}</span><br>
              <span style="font-size:10px;color:#dc2626">+${ecartOver} ${I18n.t('r6_vs_moy')}</span>
            </td>
            <td>${candHtml}</td>
            <td class="col-heures">${fmtMin(dur)}</td>
          </tr>`);
        });
      });

      if (rows.length) {
        cards.push({
          cat: 'h',
          cls: 'tag-suggest',
          icon: '🔄',
          title: `${I18n.t('r6_redist_h_title')} (${I18n.t('r6_h_moy')} ${fmtMin(Math.round(AVG_H_min))} · ${I18n.t('r6_cible_label')} ${fmtMin(Math.round(AVG_H_min * 0.8))}–${fmtMin(Math.round(AVG_H_min * 1.2))})`,
          body: `<p>${I18n.t('r6_redist_h_body')}</p>
                 <table class="redist-table" style="margin-top:10px">
                   <thead><tr><th>${I18n.t('r6_col_jour_horaire')}</th><th>${I18n.t('col_atelier')}</th><th>${I18n.t('r6_col_actuel')}</th><th>${I18n.t('r6_col_remplacants')}</th><th>${I18n.t('r6_col_duree_short')}</th></tr></thead>
                   <tbody>${rows.join('')}</tbody>
                 </table>
                 <p style="margin-top:10px;font-size:11px;color:var(--muted);">💡 ${I18n.t('r6_tip_redist_h')}</p>`
        });
      }
    }
  }

  // ════════════════════════════════════════════════
  // CARTE : Redistribution angels — suggestions détaillées
  // ════════════════════════════════════════════════
  {
    const overloadedA = angelActifs.filter(p => p.minutes > AVG_A_min * 1.2);
    const availableA  = angelActifs.filter(p => p.minutes < AVG_A_min * 0.85);

    if (overloadedA.length) {
      function hasConflictA(nom, jour, iv) {
        const p = angelStats.find(x => x.nom === nom);
        if (!p) return false;
        return p.assignments.some(a => {
          if (a.jour !== jour) return false;
          const aiv = parseInterval(a.heure);
          if (!aiv) return false;
          return aiv.s < iv.e && aiv.e > iv.s;
        });
      }
      function hasConflictH(nom, jour, iv) {
        const p = helperStats.find(x => x.nom === nom);
        if (!p) return false;
        return p.assignments.some(a => {
          if (a.jour !== jour) return false;
          const aiv = parseInterval(a.heure);
          if (!aiv) return false;
          return aiv.s < iv.e && aiv.e > iv.s;
        });
      }

      // Récupérer dans AGENDA les ateliers couverts par chaque angel
      const angelBlocks = {};
      AGENDA.forEach(e => {
        if (!e.angel || !typeActif(e.type)) return;
        const key = `${e.angel}||${e.jour}||${e.heure}`;
        if (!angelBlocks[key]) angelBlocks[key] = { angel: e.angel, jour: e.jour, heure: e.heure, ateliers: [] };
        angelBlocks[key].ateliers.push(e.atelier);
      });

      const rows = [];
      overloadedA.forEach(overP => {
        const byDay = {};
        overP.assignments.forEach(a => {
          if (!byDay[a.jour]) byDay[a.jour] = [];
          byDay[a.jour].push(a);
        });

        Object.entries(byDay).forEach(([jour, dayList]) => {
          const seen = new Set();
          dayList.forEach(a => {
            const iv = parseInterval(a.heure);
            if (!iv) return;
            const key = `${iv.s}|${iv.e}`;
            if (seen.has(key)) return;
            seen.add(key);

            // Candidats : tous les angels actifs, triés par charge croissante
            const candidatesAll = angelActifs
              .filter(avP => {
                if (avP.nom === overP.nom) return false;
                if (hasConflictA(avP.nom, jour, iv)) return false;
                if (hasConflictH(avP.nom, jour, iv)) return false;
                return true;
              })
              .sort((a, b) => a.minutes - b.minutes)
              .slice(0, 4);

            if (candidatesAll.length === 0) return;

            const dur = iv.e - iv.s;
            const ateliersCoverts = Object.values(angelBlocks)
              .filter(b => b.angel === overP.nom && b.jour === jour)
              .filter(b => {
                const biv = parseInterval(b.heure);
                return biv && biv.s >= iv.s && biv.e <= iv.e;
              })
              .flatMap(b => b.ateliers)
              .filter(n => !n.startsWith('Angel -'));

            const ecartOver = fmtMin(Math.round(overP.minutes - AVG_A_min));

            const candUnder = candidatesAll.filter(c => c.minutes < AVG_A_min);
            const candOther = candidatesAll.filter(c => c.minutes >= AVG_A_min);
            const candHtml = [
              ...candUnder.map(c => {
                const gain = fmtMin(Math.round(AVG_A_min - c.minutes));
                return `<span style="color:#16a34a;font-weight:600">${c.nom}</span> <span style="font-size:10px;color:var(--muted)">${fmtMin(c.minutes)} — ${I18n.t('r6_sous_moy_de')} ${gain}</span>`;
              }),
              ...candOther.slice(0, 2).map(c => `${c.nom} <span style="font-size:10px;color:var(--muted)">${fmtMin(c.minutes)}</span>`)
            ].join('<br>');

            rows.push(`<tr>
              <td class="col-atelier">${jour}<br><span style="font-size:11px;color:var(--muted)">${a.heure}</span></td>
              <td>${ateliersCoverts.length ? ateliersCoverts.join('<br>') : a.atelier}</td>
              <td class="col-actuel">${overP.nom}<br>
                <span style="font-size:10px;font-weight:400;color:var(--muted)">${fmtMin(overP.minutes)} ${I18n.t('r6_total')}</span><br>
                <span style="font-size:10px;color:#dc2626">+${ecartOver} ${I18n.t('r6_vs_moy')}</span>
              </td>
              <td>${candHtml}</td>
              <td class="col-heures">${fmtMin(dur)}</td>
            </tr>`);
          });
        });
      });

      if (rows.length) {
        cards.push({
          cat: 'a',
          cls: 'tag-suggest',
          icon: '🔄',
          title: `${I18n.t('r6_redist_a_title')} (${I18n.t('r6_h_moy')} ${fmtMin(Math.round(AVG_A_min))} · ${I18n.t('r6_cible_label')} ${fmtMin(Math.round(AVG_A_min * 0.8))}–${fmtMin(Math.round(AVG_A_min * 1.2))})`,
          body: `<p>${I18n.t('r6_redist_h_body')}</p>
                 <table class="redist-table" style="margin-top:10px">
                   <thead><tr><th>${I18n.t('r6_col_jour_horaire')}</th><th>${I18n.t('col_atelier')}</th><th>${I18n.t('r6_col_actuel')}</th><th>${I18n.t('r6_col_remplacants')}</th><th>${I18n.t('r6_col_duree_short')}</th></tr></thead>
                   <tbody>${rows.join('')}</tbody>
                 </table>
                 <p style="margin-top:10px;font-size:11px;color:var(--muted);">💡 ${I18n.t('r6_tip_redist_a')}</p>`
        });
      }
    }
  }

  // ── Helpers surchargés (résumé simple) ─────────────────────────────────────
  const overH = helperActifs.filter(p => p.minutes > AVG_H_min * 1.4);
  if (overH.length) {
    cards.push({
      cat: 'h',
      cls: 'tag-overload',
      icon: '🔴',
      title: I18n.t('r6_charge_elevee_h'),
      body: `<p>${I18n.t('r6_charge_elevee_h_body')} (${fmtMin(Math.round(AVG_H_min))}) :</p>
             <ul>${overH.map(p => `<li><strong>${p.nom}</strong> — ${p.count} ${I18n.t('r6_ateliers')} · ${fmtMin(p.minutes)}${globalNote(p.nom)}</li>`).join('')}</ul>`
    });
  }

  // ── Helpers peu chargés ─────────────────────────────────────────────────────
  const lightH = helperActifs.filter(p => {
    if (p.minutes >= AVG_H_min * 0.6 || p.minutes === 0) return false;
    const g = globalLoad[p.nom];
    return !g || g.minutes <= AVG_GLOBAL_min * 1.3;
  });
  const lightHHidden = helperActifs.filter(p =>
    p.minutes < AVG_H_min * 0.6 && p.minutes > 0 &&
    globalLoad[p.nom] && globalLoad[p.nom].minutes > AVG_GLOBAL_min * 1.3
  );
  if (lightH.length || lightHHidden.length) {
    const listAvail = lightH.map(p => `<li><strong>${p.nom}</strong> — ${p.count} ${p.count > 1 ? I18n.t('r6_ateliers_pl') : I18n.t('r6_atelier')} · ${fmtMin(p.minutes)}${globalNote(p.nom)}</li>`).join('');
    const listBusy  = lightHHidden.map(p => `<li><strong>${p.nom}</strong> — ${I18n.t('r6_dispo_h_busy').replace(':', '')} (${fmtMin(p.minutes)}) — ${I18n.t('r6_charge_globale')} ${fmtMin(globalLoad[p.nom].minutes)} (${globalLoad[p.nom].roles.join(' + ')})</li>`).join('');
    cards.push({
      cat: 'h',
      cls: 'tag-light',
      icon: '🟢',
      title: I18n.t('r6_dispo_h'),
      body: (lightH.length ? `<p>${I18n.t('r6_dispo_h_body')}</p><ul>${listAvail}</ul><p style="margin-top:8px;">💡 ${I18n.t('r6_dispo_h_tip')}</p>` : '')
          + (lightHHidden.length ? `<p style="margin-top:10px;"><strong>⚠️ ${I18n.t('r6_dispo_h_busy')}</strong></p><ul>${listBusy}</ul><p style="margin-top:6px;color:var(--muted);font-size:12px;">${I18n.t('r6_dispo_h_warn')}</p>` : '')
    });
  }

  // ── Angels surchargés (résumé) ──────────────────────────────────────────────
  const overA = angelActifs.filter(p => p.minutes > AVG_A_min * 1.4);
  if (overA.length) {
    cards.push({
      cat: 'a',
      cls: 'tag-overload',
      icon: '🔴',
      title: I18n.t('r6_charge_elevee_a'),
      body: `<p>${I18n.t('r6_charge_elevee_a_body')} (${fmtMin(Math.round(AVG_A_min))}) :</p>
             <ul>${overA.map(p => `<li><strong>${p.nom}</strong> — ${p.count} ${I18n.t('r6_blocs_uniques')} · ${fmtMin(p.minutes)} ${I18n.t('r6_net')}${globalNote(p.nom)}</li>`).join('')}</ul>`
    });
  }

  // ── Angels peu chargés ──────────────────────────────────────────────────────
  const lightA = angelActifs.filter(p => {
    if (p.minutes >= AVG_A_min * 0.6 || p.minutes === 0) return false;
    const g = globalLoad[p.nom];
    return !g || g.minutes <= AVG_GLOBAL_min * 1.3;
  });
  if (lightA.length) {
    cards.push({
      cat: 'a',
      cls: 'tag-light',
      icon: '🟢',
      title: I18n.t('r6_dispo_a'),
      body: `<p>${I18n.t('r6_dispo_a_body')}</p>
             <ul>${lightA.map(p => `<li><strong>${p.nom}</strong> — ${p.count} ${I18n.t('r6_blocs_uniques')} · ${fmtMin(p.minutes)}${globalNote(p.nom)}</li>`).join('')}</ul>`
    });
  }

  // ── Déséquilibre global helpers ─────────────────────────────────────────────
  const maxHmin = helperActifs.reduce((m, p) => Math.max(m, p.minutes), 0);
  const minHmin = helperActifs.filter(p => p.minutes > 0).reduce((m, p) => Math.min(m, p.minutes), Infinity);
  if (maxHmin - minHmin > 120) { // > 2h d'écart
    const topH = helperActifs.find(p => p.minutes === maxHmin);
    const botH = helperActifs.filter(p => p.minutes > 0).find(p => p.minutes === minHmin);
    cards.push({
      cat: 'h',
      cls: 'tag-suggest',
      icon: '⚠️',
      title: I18n.t('r6_desequilibre_h'),
      body: `<p>${I18n.t('r6_ecart_label')} helper ${I18n.t('r6_plus_charge')} (<strong>${topH?.nom}</strong> — ${fmtMin(topH?.minutes)}) ${I18n.t('r6_est_de')} ${I18n.t('r6_moins_charge')} (<strong>${botH?.nom}</strong> — ${fmtMin(botH?.minutes)}) ${I18n.t('r6_est_de')} <strong>${fmtMin(maxHmin - minHmin)}</strong>.</p>
             <p style="margin-top:8px;">💡 ${I18n.t('r6_cible_fourchette')} ${fmtMin(Math.round(AVG_H_min * 0.8))} – ${fmtMin(Math.round(AVG_H_min * 1.2))}.</p>`
    });
  }

  if (MAX_A - MIN_A > 3) {
    cards.push({
      cat: 'a',
      cls: 'tag-suggest',
      icon: '⚠️',
      title: I18n.t('r6_desequilibre_a'),
      body: `<p>${I18n.t('r6_ecart_label')} angel ${I18n.t('r6_plus_charge')} (<strong>${angelActifs[0]?.nom}</strong> — ${MAX_A} ${I18n.t('r6_blocs_uniques')}) ${I18n.t('r6_est_de')} ${I18n.t('r6_moins_charge')} (<strong>${angelActifs[angelActifs.length-1]?.nom}</strong> — ${MIN_A} ${I18n.t('r6_blocs_uniques')}) ${I18n.t('r6_est_de')} <strong>${MAX_A - MIN_A}</strong>.</p>
             <p style="margin-top:8px;">💡 ${I18n.t('r6_cible_max_angel')} ${Math.ceil(AVG_A * 1.3)} ${I18n.t('r6_blocs_par_angel')}</p>`
    });
  }

  // ── Traducteurs surchargés ──────────────────────────────────────────────────
  const overT = tradActifs.filter(p => p.minutes > AVG_T_min * 1.4);
  if (overT.length) {
    cards.push({
      cat: 't',
      cls: 'tag-overload',
      icon: '🔴',
      title: I18n.t('r6_charge_elevee_t'),
      body: `<p>${I18n.t('r6_charge_elevee_t_body')} (${fmtMin(Math.round(AVG_T_min))}) :</p>
             <ul>${overT.map(p => `<li><strong>${p.nom}</strong> — ${p.count} ${p.count > 1 ? I18n.t('r6_ateliers_pl') : I18n.t('r6_atelier')} · ${fmtMin(p.minutes)}${globalNote(p.nom)}</li>`).join('')}</ul>`
    });
  }

  const lightT = tradActifs.filter(p => {
    if (p.minutes >= AVG_T_min * 0.6 || p.minutes === 0) return false;
    const g = globalLoad[p.nom];
    return !g || g.minutes <= AVG_GLOBAL_min * 1.3;
  });
  if (lightT.length) {
    cards.push({
      cat: 't',
      cls: 'tag-light',
      icon: '🟢',
      title: I18n.t('r6_dispo_t'),
      body: `<p>${I18n.t('r6_dispo_t_body')}</p>
             <ul>${lightT.map(p => `<li><strong>${p.nom}</strong> — ${p.count} ${p.count > 1 ? I18n.t('r6_ateliers_pl') : I18n.t('r6_atelier')} · ${fmtMin(p.minutes)}${globalNote(p.nom)}</li>`).join('')}</ul>`
    });
  }

  if (MAX_T - MIN_T > 3) {
    cards.push({
      cat: 't',
      cls: 'tag-suggest',
      icon: '⚠️',
      title: I18n.t('r6_desequilibre_t'),
      body: `<p>${I18n.t('r6_ecart_label')} ${I18n.t('r6_tab_traducteurs').toLowerCase()} ${I18n.t('r6_plus_charge')} (<strong>${tradActifs[0]?.nom}</strong> — ${MAX_T} ${I18n.t('r6_ateliers_pl')}) ${I18n.t('r6_est_de')} ${I18n.t('r6_moins_charge')} (<strong>${tradActifs[tradActifs.length-1]?.nom}</strong> — ${MIN_T} ${I18n.t('r6_ateliers_pl')}) ${I18n.t('r6_est_de')} <strong>${MAX_T - MIN_T} ${I18n.t('r6_ateliers_pl')}</strong>.</p>
             <p style="margin-top:8px;">💡 ${I18n.t('r6_cible_max_trad')} ${Math.ceil(AVG_T * 1.3)} ${I18n.t('r6_ateliers_par_trad')}</p>`
    });
  }

  // ── Redistribution traducteurs — suggestions ───────────────────────────────
  {
    const overloadedT = tradActifs.filter(p => p.minutes > AVG_T_min * 1.2);

    if (overloadedT.length && tradActifs.length > 1) {
      function hasConflictT(nom, jour, iv) {
        const p = tradStats.find(x => x.nom === nom);
        if (!p) return false;
        return p.assignments.some(a => {
          if (a.jour !== jour) return false;
          const aiv = parseInterval(a.heure);
          if (!aiv) return false;
          return aiv.s < iv.e && aiv.e > iv.s;
        });
      }

      const rows = [];
      overloadedT.forEach(overP => {
        const ateliersSorted = overP.assignments
          .filter(a => parseDuration(a.heure) >= 60)
          .sort((a, b) => parseDuration(b.heure) - parseDuration(a.heure));

        let transfertCount = 0;
        ateliersSorted.forEach(atelier => {
          if (transfertCount >= 3) return;
          const iv = parseInterval(atelier.heure);
          if (!iv) return;

          const candidatesAll = tradActifs
            .filter(avP => {
              if (avP.nom === overP.nom) return false;
              if (hasConflictT(avP.nom, atelier.jour, iv)) return false;
              return true;
            })
            .sort((a, b) => a.minutes - b.minutes)
            .slice(0, 4);

          if (candidatesAll.length === 0) return;

          transfertCount++;
          const dur = parseDuration(atelier.heure);
          const ecartOver = fmtMin(Math.round(overP.minutes - AVG_T_min));

          const candUnder = candidatesAll.filter(c => c.minutes < AVG_T_min);
          const candOther = candidatesAll.filter(c => c.minutes >= AVG_T_min);
          const candHtml = [
            ...candUnder.map(c => {
              const gain = fmtMin(Math.round(AVG_T_min - c.minutes));
              return `<span style="color:#16a34a;font-weight:600">${c.nom}</span> <span style="font-size:10px;color:var(--muted)">${fmtMin(c.minutes)} — ${I18n.t('r6_sous_moy_de')} ${gain}</span>`;
            }),
            ...candOther.slice(0, 2).map(c => `${c.nom} <span style="font-size:10px;color:var(--muted)">${fmtMin(c.minutes)}</span>`)
          ].join('<br>');

          rows.push(`<tr>
            <td class="col-atelier">${atelier.jour}<br><span style="font-weight:400;color:var(--muted);font-size:11px">${atelier.heure}</span></td>
            <td style="font-weight:600">${atelier.atelier}</td>
            <td class="col-actuel">${overP.nom}<br>
              <span style="font-size:10px;font-weight:400;color:var(--muted)">${fmtMin(overP.minutes)} ${I18n.t('r6_total')}</span><br>
              <span style="font-size:10px;color:#dc2626">+${ecartOver} ${I18n.t('r6_vs_moy')}</span>
            </td>
            <td>${candHtml}</td>
            <td class="col-heures">${fmtMin(dur)}</td>
          </tr>`);
        });
      });

      if (rows.length) {
        cards.push({
          cat: 't',
          cls: 'tag-suggest',
          icon: '🔄',
          title: `${I18n.t('r6_redist_t_title')} (${I18n.t('r6_h_moy')} ${fmtMin(Math.round(AVG_T_min))} · ${I18n.t('r6_cible_label')} ${fmtMin(Math.round(AVG_T_min * 0.8))}–${fmtMin(Math.round(AVG_T_min * 1.2))})`,
          body: `<p>${I18n.t('r6_redist_t_body')}</p>
                 <table class="redist-table" style="margin-top:10px">
                   <thead><tr><th>${I18n.t('r6_col_jour_horaire')}</th><th>${I18n.t('col_atelier')}</th><th>${I18n.t('r6_col_actuel')}</th><th>${I18n.t('r6_col_remplacants')}</th><th>${I18n.t('r6_col_duree_short')}</th></tr></thead>
                   <tbody>${rows.join('')}</tbody>
                 </table>
                 <p style="margin-top:10px;font-size:11px;color:var(--muted);">💡 ${I18n.t('r6_tip_redist_t')}</p>`
        });
      }
    }
  }

  // ── Personnes multi-rôles avec charge globale élevée ───────────────────────
  const multiOverload = allGlobal.filter(p => p.roles.length > 1 && p.minutes > AVG_GLOBAL_min * 1.5);
  if (multiOverload.length) {
    multiOverload.sort((a, b) => b.minutes - a.minutes);
    cards.push({
      cat: 'global',
      cls: 'tag-overload',
      icon: '🔴',
      title: I18n.t('r6_multi_overload'),
      body: `<p>${I18n.t('r6_multi_overload_body')} (${fmtMin(Math.round(AVG_GLOBAL_min))}) :</p>
             <ul>${multiOverload.map(p => `<li><strong>${p.nom}</strong> — ${fmtMin(p.minutes)} (${p.roles.join(' + ')}) · ${p.count} ${I18n.t('r6_ateliers')}</li>`).join('')}</ul>
             <p style="margin-top:8px;">💡 ${I18n.t('r6_multi_tip')}</p>`
    });
  }

  // ── Rappel important ────────────────────────────────────────────────────────
  cards.push({
    cat: 'global',
    cls: '',
    icon: '⚠️',
    title: I18n.t('r6_verif_title'),
    body: `<p>${I18n.t('r6_verif_body')}</p>
           <ul>
             <li>${I18n.t('r6_verif_li1')}</li>
             <li>${I18n.t('r6_verif_li2')}</li>
             <li>${I18n.t('r6_verif_li3')}</li>
             <li>${I18n.t('r6_verif_li4')}</li>
           </ul>`
  });

  return cards;
}

// ════════════════════════════════════════════════
// RENDER PRINCIPAL
// ════════════════════════════════════════════════
function render() {
  const jourFilter    = document.getElementById('filterJour').value;
  const personFilter  = document.getElementById('filterPersonne').value;
  const { helperStats, angelStats, tradStats, helpersExclus } = buildStats(jourFilter);

  // Appliquer le filtre personne si actif
  const filterList = list => personFilter ? list.filter(p => p.nom === personFilter) : list;
  const hStats = filterList(helperStats);
  const aStats = filterList(angelStats);
  const tStats = filterList(tradStats);

  // Summary bar
  // Pour les moyennes helpers : exclure les colibri/manager/admin
  const helpersPourMoy = helperStats.filter(p => !helpersExclus.has(p.nom));
  const totalH    = helperStats.reduce((s, p) => s + p.count, 0);
  const totalA    = angelStats.reduce((s, p) => s + p.count, 0);
  const totalT    = tradStats.reduce((s, p) => s + p.count, 0);
  const avgH      = helpersPourMoy.length ? (helpersPourMoy.reduce((s, p) => s + p.count, 0) / helpersPourMoy.length).toFixed(1) : 0;
  const avgA      = angelStats.length  ? (totalA / angelStats.length).toFixed(1)  : 0;
  const avgT      = tradStats.length   ? (totalT / tradStats.length).toFixed(1)   : 0;
  const avgHmin   = helpersPourMoy.length ? Math.round(helpersPourMoy.reduce((s, p) => s + p.minutes, 0) / helpersPourMoy.length) : 0;
  const avgAmin   = angelStats.length  ? Math.round(angelStats.reduce((s, p) => s + p.minutes, 0)  / angelStats.length)  : 0;
  const avgTmin   = tradStats.length   ? Math.round(tradStats.reduce((s, p) => s + p.minutes, 0)   / tradStats.length)   : 0;

  document.getElementById('summaryBar').innerHTML = `
    <div class="sum-pill"><div class="num" style="color:var(--helper-text)">${helperStats.length}</div><div class="lbl">${I18n.t('r6_helpers_actifs')}</div></div>
    <div class="sum-pill"><div class="num" style="color:var(--helper-text)">${avgH}</div><div class="lbl">${I18n.t('r6_moy_ateliers_helper')}</div></div>
    <div class="sum-pill"><div class="num" style="color:var(--helper-text)">${fmtMin(avgHmin)}</div><div class="lbl">${I18n.t('r6_moy_heures_helper')}</div></div>
    <div class="sum-pill"><div class="num" style="color:var(--angel-text)">${angelStats.length}</div><div class="lbl">${I18n.t('r6_angels_actifs')}</div></div>
    <div class="sum-pill"><div class="num" style="color:var(--angel-text)">${avgA}</div><div class="lbl">${I18n.t('r6_moy_ateliers_angel')}</div></div>
    <div class="sum-pill"><div class="num" style="color:var(--angel-text)">${fmtMin(avgAmin)}</div><div class="lbl">${I18n.t('r6_moy_heures_angel')}</div></div>
    <div class="sum-pill"><div class="num" style="color:var(--trad-text)">${tradStats.length}</div><div class="lbl">${I18n.t('r6_trads_actifs')}</div></div>
    <div class="sum-pill"><div class="num" style="color:var(--trad-text)">${avgT}</div><div class="lbl">${I18n.t('r6_moy_ateliers_trad')}</div></div>
    <div class="sum-pill"><div class="num" style="color:var(--trad-text)">${fmtMin(avgTmin)}</div><div class="lbl">${I18n.t('r6_moy_heures_trad')}</div></div>
  ` + (helpersExclus.size > 0 ? `<p style="font-size:11px;color:var(--muted);margin-top:6px;">${I18n.t('r6_moy_exclu_note')} ${helpersPourMoy.length} ${I18n.t('r6_moy_exclu_hors')} ${[...helpersExclus].join(', ')})</p>` : '');

  // Person grid
  const grid = document.getElementById('personGrid');

  if (currentTab === 'h') {
    const max = hStats.length ? hStats[0].minutes : 1;
    grid.innerHTML = hStats.length
      ? hStats.map((p, i) => renderPersonCard(p, i + 1, max, 'Helper')).join('')
      : `<p style="color:var(--muted);padding:20px 0;">${I18n.t('r6_no_helper')}</p>`;
  } else if (currentTab === 'a') {
    const max = aStats.length ? aStats[0].minutes : 1;
    grid.innerHTML = aStats.length
      ? aStats.map((p, i) => renderPersonCard(p, i + 1, max, 'Angel')).join('')
      : `<p style="color:var(--muted);padding:20px 0;">${I18n.t('r6_no_angel')}</p>`;
  } else if (currentTab === 't') {
    const max = tStats.length ? tStats[0].minutes : 1;
    grid.innerHTML = tStats.length
      ? tStats.map((p, i) => renderPersonCard(p, i + 1, max, 'Traducteur')).join('')
      : `<p style="color:var(--muted);padding:20px 0;">${I18n.t('r6_no_trad')}</p>`;
  } else {
    // Vue combinée — fusionne les rôles multiples par personne
    const allByNom = {};
    const addToMap = (list, role) => list.forEach(p => {
      if (!allByNom[p.nom]) allByNom[p.nom] = { nom: p.nom, roles: [], count: 0, minutes: 0, assignments: [] };
      allByNom[p.nom].roles.push(role);
      allByNom[p.nom].count     += p.count;
      allByNom[p.nom].minutes   += p.minutes;
      allByNom[p.nom].assignments = [...allByNom[p.nom].assignments, ...p.assignments];
    });
    addToMap(hStats, 'Helper');
    addToMap(aStats, 'Angel');
    addToMap(tStats, 'Traducteur');
    const finalList = Object.values(allByNom).map(p => ({
      ...p, role: p.roles.length > 1 ? p.roles.join(' + ') : p.roles[0]
    })).sort((a, b) => b.minutes - a.minutes || b.count - a.count);

    const max = finalList.length ? finalList[0].minutes : 1;
    grid.innerHTML = finalList.map((p, i) => renderPersonCard(p, i + 1, max, p.role)).join('');
  }

  // Harmonisation — calculée et mise en cache pour openHarmony()
  const harmonyCards = buildHarmony(helperStats, angelStats, tradStats, helpersExclus);
  window._lastHarmonyCards = harmonyCards;
}

// ════════════════════════════════════════════════
// ONGLETS
// ════════════════════════════════════════════════
function setTab(t) {
  currentTab = t;
  document.getElementById('tab-h').className  = 'tab' + (t === 'h'  ? ' active-h'  : '');
  document.getElementById('tab-a').className  = 'tab' + (t === 'a'  ? ' active-a'  : '');
  document.getElementById('tab-t').className  = 'tab' + (t === 't'  ? ' active-t'  : '');
  document.getElementById('tab-s').className  = 'tab' + (t === 's'  ? ' active-s'  : '');
  document.getElementById('tab-eq').className = 'tab' + (t === 'eq' ? ' active-eq' : '');
  if (t === 'eq') {
    renderHarmony('global');
  } else {
    render();
  }
}

// ════════════════════════════════════════════════
// HARMONISATION — affichée directement dans la page
// Vue par défaut : global (classement + suggestions globales)
// Sous-navigation : 📊 Global | 🤝 Helpers | 👼 Angels | 🌐 Traducteurs
// ════════════════════════════════════════════════

function getHarmonyIntros() {
  return {
    global: I18n.t('r6_intro_global'),
    h: I18n.t('r6_intro_h'),
    a: I18n.t('r6_intro_a'),
    t: I18n.t('r6_intro_t')
  };
}

let harmonyView = 'global';

function renderHarmony(view) {
  harmonyView = view || 'global';
  const cards = window._lastHarmonyCards || [];

  // Summary bar : sous-navigation des vues harmonisation
  document.getElementById('summaryBar').innerHTML = `
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;width:100%">
      <span style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-right:4px">${I18n.t('r6_vue_label')}</span>
      <button onclick="renderHarmony('global')" style="cursor:pointer;padding:6px 16px;border-radius:999px;border:2px solid ${harmonyView==='global'?'var(--accent)':'var(--border)'};background:${harmonyView==='global'?'#eff6ff':'var(--surface)'};font-size:13px;font-weight:600;font-family:inherit;color:${harmonyView==='global'?'var(--accent)':'var(--muted)'}">📊 ${I18n.t('r6_vue_global')}</button>
      <button onclick="renderHarmony('h')"      style="cursor:pointer;padding:6px 16px;border-radius:999px;border:2px solid ${harmonyView==='h'?'var(--helper-text)':'var(--border)'};background:${harmonyView==='h'?'var(--helper-bg)':'var(--surface)'};font-size:13px;font-weight:600;font-family:inherit;color:${harmonyView==='h'?'var(--helper-text)':'var(--muted)'}">🤝 ${I18n.t('r6_tab_helpers')}</button>
      <button onclick="renderHarmony('a')"      style="cursor:pointer;padding:6px 16px;border-radius:999px;border:2px solid ${harmonyView==='a'?'var(--angel-text)':'var(--border)'};background:${harmonyView==='a'?'var(--angel-bg)':'var(--surface)'};font-size:13px;font-weight:600;font-family:inherit;color:${harmonyView==='a'?'var(--angel-text)':'var(--muted)'}">👼 ${I18n.t('r6_tab_angels')}</button>
      <button onclick="renderHarmony('t')"      style="cursor:pointer;padding:6px 16px;border-radius:999px;border:2px solid ${harmonyView==='t'?'var(--trad-text)':'var(--border)'};background:${harmonyView==='t'?'var(--trad-bg)':'var(--surface)'};font-size:13px;font-weight:600;font-family:inherit;color:${harmonyView==='t'?'var(--trad-text)':'var(--muted)'}">🌐 ${I18n.t('r6_tab_traducteurs')}</button>
    </div>`;

  // Filtrer les cartes selon la vue
  const visible = cards.filter(c => {
    if (harmonyView === 'global') return c.cat === 'global';
    return c.cat === harmonyView || c.cat === 'global';
  });

  const intro = getHarmonyIntros()[harmonyView] || '';

  const grid = document.getElementById('personGrid');
  if (!visible.length) {
    grid.innerHTML = `
      <div class="harmony-intro">${intro}</div>
      <div style="text-align:center;padding:48px;color:var(--muted);font-style:italic;border:2px dashed var(--border);border-radius:10px;">
        ${I18n.t('r6_no_proposal')}
      </div>`;
    return;
  }

  grid.innerHTML = `
    <div class="harmony-intro">${intro}</div>
    <div class="harmony-grid">
      ${visible.map(c => `
        <div class="harmony-card ${c.cls || ''}">
          <div class="harmony-card-title">${c.icon || ''} ${c.title || ''}</div>
          ${c.body || ''}
        </div>`).join('')}
    </div>`;
}

function toggleShift(shiftId) {
  const el = document.getElementById(shiftId);
  if (el) el.classList.toggle('open');
}

// Exposer dans window les fonctions appelées depuis les onclick HTML
window.setTab        = setTab;
window.renderHarmony = renderHarmony;
window.toggleDetail  = toggleDetail;
window.toggleDay     = toggleDay;
window.toggleShift   = toggleShift;
window.render        = render;
window.hardReload    = hardReload;
window.toggleMode    = toggleMode;

// ════════════════════════════════════════════════
// INIT FILTRES
// ════════════════════════════════════════════════
(function initFilters() {
  // Filtre Jour
  const selJour = document.getElementById('filterJour');
  JOUR_ORDER.forEach(j => {
    if (AGENDA.some(e => e.jour === j)) {
      const o = document.createElement('option');
      o.value = j; o.textContent = j;
      selJour.appendChild(o);
    }
  });

  // Filtre Personne — toutes les personnes présentes dans AGENDA (helpers, angels, trads)
  const selPersonne = document.getElementById('filterPersonne');
  const nomsSet = new Set();
  AGENDA.forEach(e => {
    if (e.helper1) nomsSet.add(e.helper1);
    if (e.helper2) nomsSet.add(e.helper2);
    if (e.helper3) nomsSet.add(e.helper3);
    if (e.helper4) nomsSet.add(e.helper4);
    if (e.angel)   nomsSet.add(e.angel);
    if (e.traduction) nomsSet.add(e.traduction);
  });
  [...nomsSet].sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' })).forEach(nom => {
    const o = document.createElement('option');
    o.value = nom; o.textContent = nom;
    selPersonne.appendChild(o);
  });
})();

// ════════════════════════════════════════════════
// DARK MODE + HARD RELOAD
// ════════════════════════════════════════════════
function hardReload() {
  if ('caches' in window) {
    caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k))))
      .finally(() => location.reload(true));
  } else {
    location.reload(true);
  }
}

function toggleMode() {
  const isDark = document.body.classList.toggle('dark');
  document.getElementById('modeBtn').innerHTML = isDark
    ? `☀️ <span data-i18n="nav_mode_jour">${I18n.t('nav_mode_jour')}</span>`
    : `🌙 <span data-i18n="nav_mode_nuit">${I18n.t('nav_mode_nuit')}</span>`;
}

// Auto-refresh si ouvert depuis Home (paramètre ?v= présent)
if (location.search.includes('v=') && !sessionStorage.getItem('_refreshed_' + location.pathname)) {
  sessionStorage.setItem('_refreshed_' + location.pathname, '1');
  hardReload();
}

render();

}); // fin loadData
</script>
</body>
</html>

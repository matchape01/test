<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tantramour 2026 — Mon Planning V2</title>
<script src="ref_translations.js"></script>
<script src="i18n.js"></script>
<style>
:root {
  --bg:#ffffff; --surface:#f7f8fa; --border:#e5e7eb;
  --text:#1f2328; --muted:#57606a; --accent:#3b82d4;
  /* Ligne NOM : bleu foncé */
  --header-bg:#1e40af; --header-tx:#ffffff;
  /* Ligne JOUR : gris foncé */
  --day-bg:#374151;    --day-tx:#f9fafb;
  /* En-têtes colonnes : gris clair */
  --th-bg:#e5e7eb;     --th-tx:#374151;
  /* Données : blanc */
  --td-bg:#ffffff;     --row-alt:#f7f8fa;
  --badge-f-bg:#dcfce7; --badge-f-tx:#166534;
  --badge-h-bg:#e0f2fe; --badge-h-tx:#0369a1;
  --badge-t-bg:#f5f3ff; --badge-t-tx:#7c3aed;
  --badge-a-bg:#fee2e2; --badge-a-tx:#dc2626;
  --badge-x-bg:#f3f4f6; --badge-x-tx:#374151;
}
.dark {
  --bg:#0d1117; --surface:#161b22; --border:#30363d;
  --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff;
  /* Ligne NOM : bleu foncé mode nuit */
  --header-bg:#1e3a8a; --header-tx:#bfdbfe;
  /* Ligne JOUR : gris foncé mode nuit */
  --day-bg:#1f2937;    --day-tx:#d1d5db;
  /* En-têtes : gris mode nuit */
  --th-bg:#374151;     --th-tx:#9ca3af;
  /* Données */
  --td-bg:#161b22;     --row-alt:#1c2333;
  --badge-f-bg:#0a2e1a; --badge-f-tx:#4ade80;
  --badge-h-bg:#0c2d48; --badge-h-tx:#58a6ff;
  --badge-t-bg:#1e1b4b; --badge-t-tx:#a78bfa;
  --badge-a-bg:#2d0000; --badge-a-tx:#f87171;
  --badge-x-bg:#1f2937; --badge-x-tx:#9ca3af;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,"Segoe UI",system-ui,sans-serif; font-size:14px; line-height:1.6; background:var(--bg); color:var(--text); }
.wrap { max-width:1100px; margin:0 auto; padding:24px 20px 60px; }

/* ── HEADER ── */
header { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:12px; }
.logo h1 { font-size:19px; font-weight:700; }
.logo p  { font-size:22px; font-weight:800; color:var(--accent); line-height:1.2; margin-top:2px; }
.header-actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.btn { cursor:pointer; background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:6px 14px; font-size:13px; color:var(--text); font-family:inherit; display:inline-flex; align-items:center; gap:6px; text-decoration:none; transition:background .15s; }
.btn:hover { background:var(--border); }

/* ── FILTRES ── */
.filters { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:8px; align-items:flex-end; }
.filter-group { display:flex; flex-direction:column; gap:4px; }
.filter-group label { font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); font-weight:600; }
select, input[type="text"] { background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:7px 10px; font-size:13px; color:var(--text); font-family:inherit; cursor:pointer; }
select { min-width:150px; }
input[type="text"] { min-width:200px; }
.stats { font-size:12px; color:var(--muted); margin-bottom:16px; }
.stats span { color:var(--accent); font-weight:600; }

/* ── TABS VUE ── */
.vue-tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px; align-items:center; }
.vue-tabs-lbl { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin-right:4px; white-space:nowrap; }
.vtab { cursor:pointer; padding:7px 16px; border-radius:8px; font-size:13px; font-weight:600; border:2px solid var(--border); background:var(--surface); color:var(--muted); font-family:inherit; transition:all .15s; white-space:nowrap; }
.vtab:hover { border-color:var(--accent); color:var(--accent); }
/* Vue Combinée : violet/purple */
.vtab.active-combined { border-color:#7c3aed; background:#f5f3ff; color:#7c3aed; }
.dark .vtab.active-combined { border-color:#a78bfa; background:#1e1b4b; color:#a78bfa; }
/* Animateur : vert */
.vtab.active-animateur { border-color:#166534; background:#dcfce7; color:#166534; }
.dark .vtab.active-animateur { border-color:#4ade80; background:#0a2e1a; color:#4ade80; }
/* Helper : bleu */
.vtab.active-helper { border-color:#0369a1; background:#e0f2fe; color:#0369a1; }
.dark .vtab.active-helper { border-color:#58a6ff; background:#0c2d48; color:#58a6ff; }
/* Traducteur : violet */
.vtab.active-traducteur { border-color:#7c3aed; background:#f5f3ff; color:#7c3aed; }
.dark .vtab.active-traducteur { border-color:#a78bfa; background:#1e1b4b; color:#a78bfa; }
/* Angel : rouge */
.vtab.active-angel { border-color:#dc2626; background:#fee2e2; color:#dc2626; }
.dark .vtab.active-angel { border-color:#f87171; background:#2d0000; color:#f87171; }
/* Colibri : rose */
.vtab.active-colibri { border-color:#db2777; background:#fce7f3; color:#db2777; }
.dark .vtab.active-colibri { border-color:#f472b6; background:#500724; color:#f472b6; }

/* ── CARTE RESSOURCE ── */
.resource-list { display:flex; flex-direction:column; gap:16px; }
.resource-card { border:1px solid var(--border); border-radius:10px; overflow:hidden; }
.resource-header { display:flex; align-items:center; gap:8px; padding:10px 14px; background:var(--header-bg); color:var(--header-tx); cursor:pointer; user-select:none; flex-wrap:nowrap; min-width:0; }
.resource-header:hover { filter:brightness(1.08); }
.resource-avatar { width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,.25); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex-shrink:0; border:2px solid rgba(255,255,255,.4); }
/* Nom + badges rôles côte à côte, flex:1 pour prendre l'espace dispo */
.resource-name-wrap { display:flex; align-items:center; gap:6px; flex:1; min-width:0; overflow:hidden; }
.resource-name { font-size:14px; font-weight:700; color:var(--header-tx); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex-shrink:1; min-width:0; }
.resource-badges { display:flex; gap:3px; flex-shrink:0; flex-wrap:nowrap; }
/* Badges rôles plus petits sur la ligne NOM */
.resource-badges .badge { font-size:9px; padding:1px 5px; }
.resource-stats { font-size:12px; font-weight:700; color:rgba(255,255,255,.9); white-space:nowrap; flex-shrink:0; }
.resource-chevron { font-size:16px; color:rgba(255,255,255,.6); transition:transform .2s; flex-shrink:0; }
.resource-card.open .resource-chevron { transform:rotate(90deg); }
.resource-body { display:none; border-top:1px solid var(--border); }
.resource-card.open .resource-body { display:block; }

/* ── LIGNE JOUR ── */
.day-row { display:flex; align-items:center; gap:10px; padding:8px 16px; border-bottom:1px solid rgba(255,255,255,.1); background:var(--day-bg); cursor:pointer; transition:filter .1s; }
.day-row:last-child { border-bottom:none; }
.day-row:hover { filter:brightness(1.1); }
.day-label { font-size:12px; font-weight:800; color:#93c5fd; min-width:56px; white-space:nowrap; }
.day-date  { font-size:11px; color:#9ca3af; min-width:110px; white-space:nowrap; }
.day-roles { display:flex; gap:4px; flex-wrap:wrap; flex:1; }
.day-meta  { display:flex; gap:12px; font-size:11px; color:#9ca3af; white-space:nowrap; }
.day-meta span { font-weight:700; color:var(--day-tx); }
.day-chevron { font-size:14px; color:#9ca3af; transition:transform .2s; }
.day-row.open .day-chevron { transform:rotate(90deg); }

/* ── TABLE ATELIERS ── */
.ateliers-wrap { border-top:1px solid var(--border); overflow-x:auto; }
.ateliers-table { width:100%; border-collapse:collapse; font-size:12px; }
.ateliers-table th { background:var(--th-bg); padding:6px 10px; text-align:left; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--th-tx); border-bottom:1px solid var(--border); white-space:nowrap; }
.ateliers-table td { padding:7px 10px; border-bottom:1px solid var(--border); vertical-align:middle; background:var(--td-bg); }
.ateliers-table tr:last-child td { border-bottom:none; }
.ateliers-table tr:hover td { background:var(--row-alt); }
.at-name { font-weight:600; color:var(--text); }
.at-heure { white-space:nowrap; font-variant-numeric:tabular-nums; color:var(--accent); font-weight:600; }
.at-duree { white-space:nowrap; color:var(--muted); }
.badge { display:inline-flex; align-items:center; gap:3px; font-size:10px; font-weight:700; padding:2px 7px; border-radius:4px; white-space:nowrap; }
.badge-f  { background:var(--badge-f-bg); color:var(--badge-f-tx); }
.badge-m  { background:#ede9fe; color:#5b21b6; }
.dark .badge-m { background:#2d1a5e; color:#c4b5fd; }
.badge-h  { background:var(--badge-h-bg); color:var(--badge-h-tx); }
.badge-t  { background:var(--badge-t-bg); color:var(--badge-t-tx); }
.badge-a  { background:var(--badge-a-bg); color:var(--badge-a-tx); }
.badge-x  { background:var(--badge-x-bg); color:var(--badge-x-tx); }
.badge-lang { font-size:10px; font-weight:700; padding:1px 5px; border-radius:3px; }
.badge-fr { background:#eff6ff; color:#1d4ed8; border:1px solid #bfdbfe; }
.badge-en { background:#f0fdf4; color:#166534; border:1px solid #86efac; }
.info-btn { cursor:pointer; background:transparent; border:none; font-size:15px; padding:3px 6px; border-radius:4px; color:var(--muted); }
.info-btn:hover { background:var(--border); color:var(--accent); }

/* ── SHIFT ANGEL BLOCK ── */
.angel-shift-row td { background:var(--badge-a-bg) !important; font-weight:700; color:var(--badge-a-tx) !important; }
.angel-shift-row td.at-heure { color:var(--badge-a-tx) !important; }
.angel-shift-row td.at-name  { color:var(--badge-a-tx) !important; }
/* Chevron collapse intégré dans la ligne shift */
.angel-shift-row .shift-chevron { display:inline-block; margin-left:8px; font-size:13px; color:var(--badge-a-tx); transition:transform .2s; vertical-align:middle; opacity:.7; }
.angel-shift-row.shift-open .shift-chevron { transform:rotate(90deg); }
.angel-covered-row td { background:#fdf2f8; color:#9ca3af; }
.dark .angel-covered-row td { background:#2a0e22; color:#6b7280; }
.angel-covered-row td.at-heure { padding-left:22px; position:relative; }
.angel-covered-row td.at-heure::before { content:'└'; position:absolute; left:8px; top:6px; color:#f9a8d4; font-size:12px; line-height:1; }
.dark .angel-covered-row td.at-heure::before { color:#9d174d; }
.angel-shift-dur-pill { display:inline-block; font-size:10px; font-weight:700; background:var(--badge-a-tx); color:#fff; border-radius:99px; padding:1px 10px; margin-left:8px; vertical-align:middle; }
.dark .angel-shift-dur-pill { background:var(--badge-a-tx); }
/* Lignes couvertes masquées par défaut */
.angel-covered-row { display:none; }
.angel-covered-row.shift-visible { display:table-row; }

/* ── MODALE DÉTAIL ── */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:9999; align-items:flex-start; justify-content:center; padding:24px 16px; overflow-y:auto; }
.modal-overlay.open { display:flex; }
.modal-box { position:relative; background:var(--bg); border-radius:14px; max-width:680px; width:100%; border:1px solid var(--border); box-shadow:0 12px 40px rgba(0,0,0,.2); }
.modal-top { display:flex; align-items:flex-start; justify-content:space-between; padding:18px 22px 14px; border-bottom:1px solid var(--border); gap:12px; }
.modal-top-left { flex:1; min-width:0; }
.modal-top-right { display:flex; flex-direction:column; align-items:flex-end; gap:8px; flex-shrink:0; padding-top:28px; }
.modal-atelier { font-size:18px; font-weight:800; line-height:1.3; }
.modal-sub { font-size:12px; color:var(--muted); margin-top:3px; }
.modal-close { position:absolute; top:18px; right:22px; cursor:pointer; background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:6px 10px; font-size:15px; font-weight:700; font-family:inherit; color:var(--text); line-height:1; }
.modal-close:hover { background:var(--border); }
.modal-lang-toggle { display:flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
.modal-lang-btn { cursor:pointer; background:var(--surface); border:none; padding:5px 12px; font-size:12px; font-weight:700; font-family:inherit; color:var(--muted); }
.modal-lang-btn:not(:last-child) { border-right:1px solid var(--border); }
.modal-lang-btn.active { background:var(--accent); color:#fff; }
.modal-body { padding:18px 22px 22px; display:flex; flex-direction:column; gap:20px; }
.modal-section { }
.modal-section-title { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin-bottom:10px; padding-bottom:6px; border-bottom:1px solid var(--border); }
.modal-grid { display:grid; grid-template-columns:auto 1fr; gap:6px 16px; align-items:start; }
.modal-lbl { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); white-space:nowrap; padding-top:2px; }
.modal-val { font-size:13px; }
.modal-desc-box { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:12px 14px; font-size:13px; line-height:1.6; }
.modal-desc-lbl { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin-bottom:6px; }
.no-content { font-style:italic; color:var(--muted); font-size:12px; }
.validated-badge { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:6px; }
.validated-yes { background:#dcfce7; color:#166534; }
.validated-no  { background:#fee2e2; color:#dc2626; }
.dark .validated-yes { background:#0a2e1a; color:#4ade80; }
.dark .validated-no  { background:#2d0a0a; color:#f87171; }
.piment { letter-spacing:-2px; font-size:13px; }
footer { margin-top:40px; padding-top:14px; border-top:1px solid var(--border); text-align:center; font-size:12px; color:var(--muted); }
.empty { text-align:center; padding:48px; color:var(--muted); font-style:italic; }

@media(max-width:640px) {
  .modal-top { flex-direction:column; }
  .modal-top-right { flex-direction:row; align-items:center; }
  .day-date { display:none; }
}
</style>
</head>

<div class="wrap">
  <header>
    <div class="logo">
      <h1>Tantramour 2026</h1>
      <p data-i18n="mp_title">📋 Mon Planning V2</p>

    <div class="header-actions" id="headerActions">

        </div>
      </div>
    </div>
    <div class="modal-body" id="mBody"></div>
  </div>
</div>

<footer>Tantramour 2026 — Mon Planning V2</footer>

<script>
loadData(['data.js','ref_descriptions.js','logistics.js','logistics.helpers.js','logistics.special.js','ref_consignes_type.js','ref_consignes_recurrentes.js'], function() {

// ════════════════════════════════════════════
// UTILITAIRES
// ════════════════════════════════════════════
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function lieuLabel(lieu) {
  if (!lieu) return '—';
  if (typeof REF_LIEUX !== 'undefined') {
    var r = REF_LIEUX.find(function(l){ return l.value === lieu; });
    if (r && r.capacite) return esc(lieu) + ' <span style="color:var(--muted);font-size:11px">(' + r.capacite + ')</span>';
  }
  return esc(lieu);
}

function heureMin(h) {
  if (!h) return null;
  var m = String(h).replace(/\./g,':').match(/(\d{1,2}):(\d{2})/);
  return m ? parseInt(m[1])*60+parseInt(m[2]) : null;
}
function calcDuree(h) {
  if (!h) return null;
  var m = String(h).replace(/\./g,':').replace(/[–—]/g,'-').match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
  if (!m) return null;
  var d = (parseInt(m[3])*60+parseInt(m[4])) - (parseInt(m[1])*60+parseInt(m[2]));
  if (d < 0) d += 1440;
  return d;
}

// Extrait l'intervalle {s, e} d'une entrée à partir de son heure
function parseInterval(heure) {
  var m = String(heure||'').replace(/\./g,':').replace(/[–—]/g,'-').match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
  if (!m) return null;
  var s = parseInt(m[1])*60+parseInt(m[2]), e = parseInt(m[3])*60+parseInt(m[4]);
  if (e < s) e += 1440;
  return { s:s, e:e };
}

// Fusionne une liste d'intervalles {s,e} et retourne la somme des durées après fusion
function mergedDuration(intervals) {
  if (!intervals.length) return 0;
  var sorted = intervals.slice().sort(function(a,b){ return a.s-b.s; });
  var merged = [sorted[0]];
  for (var i=1; i<sorted.length; i++) {
    var last = merged[merged.length-1];
    if (sorted[i].s <= last.e) { last.e = Math.max(last.e, sorted[i].e); }
    else                        { merged.push(sorted[i]); }
  }
  return merged.reduce(function(t,iv){ return t+(iv.e-iv.s); }, 0);
}

// Fusionne une liste d'intervalles et retourne le nombre d'intervalles fusionnés
function mergedCount(intervals) {
  if (!intervals.length) return 0;
  var sorted = intervals.slice().sort(function(a,b){ return a.s-b.s; });
  var merged = [sorted[0]];
  for (var i=1; i<sorted.length; i++) {
    var last = merged[merged.length-1];
    if (sorted[i].s <= last.e) { last.e = Math.max(last.e, sorted[i].e); }
    else                        { merged.push(sorted[i]); }
  }
  return merged.length;
}
function fmtDuree(mins) {
  if (!mins) return '';
  var h = Math.floor(mins/60), mn = mins%60;
  return h > 0 ? (mn > 0 ? h+'h'+(mn<10?'0':'')+mn : h+'h') : mn+'min';
}
function fmtHeure(mins) {
  if (mins == null) return '';
  var h = Math.floor(mins/60)%24, m = mins%60;
  return h+':'+(m<10?'0':'')+m;
}
function noteLabel(val, lang) {
  if (!val) return '';
  if (typeof REF_NOTES !== 'undefined') {
    var e = REF_NOTES.find(function(n){ return n.value===val; });
    if (e) return (lang==='en' && e.valueEn) ? e.valueEn : e.value;
  }
  return val;
}
function pimentHtml(n) {
  return n > 0 ? '<span class="piment">'+'🌶️'.repeat(n)+'</span>' : '';
}
function isBilingue(nom) {
  if (!nom || typeof REF_RESSOURCES==='undefined') return false;
  var r = REF_RESSOURCES.find(function(x){ return x.value===nom; });
  return r && r.langues && r.langues.indexOf('FR')!==-1 && r.langues.indexOf('EN')!==-1;
}
function angelWithPhone(nom) {
  if (!nom) return '—';
  if (typeof REF_RESSOURCES === 'undefined') return esc(nom);
  var r = REF_RESSOURCES.find(function(x){ return x.value===nom; });
  if (!r || !r.tel) return esc(nom);
  return esc(nom) + ' <span style="color:var(--muted)">(' + esc(r.tel) + ')</span>';
}
function isColibri(nom) {
  if (!nom || typeof REF_RESSOURCES==='undefined') return false;
  var r = REF_RESSOURCES.find(function(x){ return x.value===nom; });
  return r && r.roles && r.roles.indexOf('colibri')!==-1;
}

  'Jour 2': { jourEn:'Day 2', date:'Dimanche 30 août', dateEn:'Sunday Aug 30'    },

function jourSubtitle(jour, lang) {
  var m = JOUR_META[jour];
  if (!m) return jour;
  var j = (lang === 'en' && m.jourEn) ? m.jourEn : jour;
  var d = (lang === 'en' && m.dateEn) ? m.dateEn : m.date;
  return j + (d ? ' — ' + d : '');
}

// Extrait les intervalles des SHIFT ANGEL (type === 'SHIFT ANGEL') parmi les entrées.
function getAngelShiftIntervals(entries) {
  var ivs = [];
  entries.forEach(function(x) {
    if ((x.entry.type||'').toUpperCase() !== 'SHIFT ANGEL') return;
    var m = String(x.entry.heure||'').replace(/\./g,':').replace(/[–—]/g,'-').match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
    if (!m) return;
    var s = parseInt(m[1])*60+parseInt(m[2]), e = parseInt(m[3])*60+parseInt(m[4]);
    if (e < s) e += 1440;
    ivs.push({ s:s, e:e });
  });
  return ivs;
}

// Calcule le nombre réel d'ateliers d'un groupe de jour :
// - Un SHIFT ANGEL compte pour 1.
// - Les ateliers couverts par un shift angel ne sont pas comptés.
// - Les REUNION simultanées (qui se chevauchent) comptent pour 1 seule par créneau fusionné.
// - Si pas de shift angel : count simple (avec dédup REUNION).
function calcNbJour(entries) {
  var shiftIvs = getAngelShiftIntervals(entries);

  // Intervalles des REUNION (pour déduplication)
  var reunionIvs = entries
    .filter(function(x){ return (x.entry.type||'').toUpperCase() === 'REUNION'; })
    .map(function(x){ return parseInterval(x.entry.heure); })
    .filter(Boolean);
  var reunionMergedNb = mergedCount(reunionIvs);
  var reunionRawNb    = reunionIvs.length;

  if (shiftIvs.length === 0) {
    // Pas de shift angel : count simple, mais REUNION dédupliquées
    var nonReunion = entries.filter(function(x){ return (x.entry.type||'').toUpperCase() !== 'REUNION'; }).length;
    return nonReunion + reunionMergedNb;
  }
  var count = 0;
  // Tracks REUNION already counted via merged slots
  var reunionMergedCounted = false;
  entries.reduce(function(n, x) {
    if ((x.entry.type||'').toUpperCase() === 'SHIFT ANGEL') { count++; return n; }
    if ((x.entry.type||'').toUpperCase() === 'REUNION') return n; // traitées séparément
    var iv = parseInterval(x.entry.heure);
    if (!iv) { count++; return n; }
    var covered = shiftIvs.some(function(s){ return iv.s>=s.s && iv.e<=s.e; });
    if (!covered) count++;
    return n;
  }, 0);
  // Ajouter les REUNION dédupliquées (non couvertes par shift)
  if (reunionIvs.length > 0) {
    var uncoveredReunions = reunionIvs.filter(function(iv){
      return !shiftIvs.some(function(s){ return iv.s>=s.s && iv.e<=s.e; });
    });
    count += mergedCount(uncoveredReunions);
  }
  return count;
}

// Calcule la durée réelle d'un groupe de jour :
// - Pour chaque SHIFT ANGEL : on compte la durée du shift.
// - Pour chaque autre entrée : on ne la compte QUE si elle n'est pas couverte par un shift angel.
// - Les REUNION simultanées (qui se chevauchent) ne comptent que la durée de l'union des créneaux.
// - Si pas de shift angel : somme des durées avec dédup REUNION.
function calcDurJour(entries) {
  var shiftIvs = getAngelShiftIntervals(entries);

  // Intervalles des REUNION (pour déduplication)
  var reunionIvs = entries
    .filter(function(x){ return (x.entry.type||'').toUpperCase() === 'REUNION'; })
    .map(function(x){ return parseInterval(x.entry.heure); })
    .filter(Boolean);

  if (shiftIvs.length === 0) {
    // Pas de shift : somme normale pour les non-REUNION + durée fusionnée pour les REUNION
    var nonReunionDur = entries.reduce(function(t,x) {
      if ((x.entry.type||'').toUpperCase() === 'REUNION') return t;
      return t + (calcDuree(x.entry.heure)||0);
    }, 0);
    return nonReunionDur + mergedDuration(reunionIvs);
  }

  // Avec shift angel
  var shiftDur = shiftIvs.reduce(function(t,iv){ return t+(iv.e-iv.s); }, 0);
  var extraDur = entries.reduce(function(t,x) {
    if ((x.entry.type||'').toUpperCase() === 'SHIFT ANGEL') return t; // déjà compté
    if ((x.entry.type||'').toUpperCase() === 'REUNION') return t;     // traité séparément
    var iv = parseInterval(x.entry.heure);
    if (!iv) return t;
    var covered = shiftIvs.some(function(s){ return iv.s>=s.s && iv.e<=s.e; });
    return covered ? t : t+(iv.e-iv.s);
  }, 0);
  // Durée des REUNION non couvertes par shift (dédupliquées)
  var uncoveredReunions = reunionIvs.filter(function(iv){
    return !shiftIvs.some(function(s){ return iv.s>=s.s && iv.e<=s.e; });
  });
  return shiftDur + extraDur + mergedDuration(uncoveredReunions);
}

// ════════════════════════════════════════════
// Pour chaque atelier, on détermine le(s) rôle(s) de chaque personne
function buildIndex() {
  // Map nom → [ { entry, roles[] } ]
  var idx = new Map();

  function add(nom, entry, role) {
    if (!nom || !nom.trim()) return;
    var key = nom.trim();
    if (!idx.has(key)) idx.set(key, []);
    var arr = idx.get(key);
    // Chercher si l'entry existe déjà (même atelier, même jour)
    var found = arr.find(function(x){
      return x.entry.atelier===entry.atelier && x.entry.jour===entry.jour && x.entry.heure===entry.heure;
    });
    if (found) { if (found.roles.indexOf(role)===-1) found.roles.push(role); }
    else arr.push({ entry: entry, roles: [role] });
  }

  AGENDA.forEach(function(e) {
    if (e.fac1)       add(e.fac1, e, 'animateur');
    if (e.fac2)       add(e.fac2, e, 'animateur');
    if (e.fac3)       add(e.fac3, e, 'animateur');
    if (e.fac4)       add(e.fac4, e, 'animateur');
    if (e.traduction) add(e.traduction, e, 'traducteur');
    if (e.helper1)    add(e.helper1, e, 'helper');
    if (e.helper2)    add(e.helper2, e, 'helper');
    if (e.helper3)    add(e.helper3, e, 'helper');
    if (e.helper4)    add(e.helper4, e, 'helper');
    if (e.angel)      add(e.angel, e, 'angel');
    // REUNION : diffuser à toutes les personnes des rôles sélectionnés
    if (e.type === 'REUNION' && e.meetingRoles) {
      var roles = e.meetingRoles.split(',').map(function(r) { return r.trim(); }).filter(Boolean);
      if (roles.length && typeof REF_RESSOURCES !== 'undefined') {
        REF_RESSOURCES.forEach(function(res) {
          if (!res.value) return;
          var hasRole = roles.some(function(r) { return res.roles && res.roles.indexOf(r) !== -1; });
          if (!hasRole) return;
          var alreadyAdded = [e.fac1,e.fac2,e.fac3,e.fac4,e.traduction,e.helper1,e.helper2,e.helper3,e.helper4,e.angel].indexOf(res.value) !== -1;
          if (!alreadyAdded) add(res.value, e, 'reunion');
        });
      }
    }
  });
  return idx;
}

// ── État de la vue active (géré par les tabs, pas par un select) ──────────
var currentVue = '';   // '' = Vue Combinée

window.setVue = function(btn, vue) {
  // Mémoriser l'état ouvert avant de re-rendre
  var openCards = [];
  var openDays  = {};
  document.querySelectorAll('.resource-card').forEach(function(card, ri) {
    if (card.classList.contains('open')) openCards.push(ri);
  });
  document.querySelectorAll('[id^="tbl-"]').forEach(function(el) {
    if (el.style.display !== 'none') openDays[el.id] = true;
  });

  currentVue = vue;

  // Mettre à jour l'apparence des tabs
  document.querySelectorAll('#vueTabs .vtab').forEach(function(b) {
    b.className = 'vtab'; // reset
  });
  var activeClass = vue === '' ? 'active-combined' : 'active-' + vue;
  btn.classList.add(activeClass);

  applyFilters();

  // Restaurer l'état ouvert
  openCards.forEach(function(ri) {
    var card = document.getElementById('rcard-'+ri);
    if (card) card.classList.add('open');
  });
  Object.keys(openDays).forEach(function(id) {
    var tbl  = document.getElementById(id);
    var parts = id.split('-');
    var rowId = 'drow-'+parts[1]+'-'+parts[2];
    var row   = document.getElementById(rowId);
    if (tbl)  tbl.style.display  = 'block';
    if (row)  row.classList.add('open');
  });
};

window.applyFilters = function applyFilters() {
  var fNom    = document.getElementById('fNom').value;
  var fSearch = document.getElementById('fSearch').value.trim().toLowerCase();
  var fRole   = currentVue;   // '' = Vue Combinée
  if (fNom === '__NONE__') {
    document.getElementById('stats').innerHTML = '<span>0</span> personne(s)';
    document.getElementById('resourceList').innerHTML = '<div class="empty">Aucun résultat pour ces filtres.</div>';
    return;
  }

  // Filtrer les noms de ressources
  var results = [];
  FULL_INDEX.forEach(function(entries, nom) {
    // Filtre select nom exact
    if (fNom && fNom !== '__ALL__' && nom !== fNom) return;
    // Filtre recherche texte libre
    if (fSearch && nom.toLowerCase().indexOf(fSearch)===-1) return;

    // Vue par rôle : garder uniquement les entrées correspondant au rôle sélectionné
    var filteredEntries;
    if (!fRole) {
      // Vue Combinée : toutes les entrées
      filteredEntries = entries;
    } else if (fRole === 'colibri') {
      if (!isColibri(nom)) return;
      // Colibri : entrées helper ou traducteur
      filteredEntries = entries.filter(function(x) {
        return x.roles.indexOf('helper') !== -1 || x.roles.indexOf('traducteur') !== -1;
      });
    } else {
      // Vue Animateur / Helper / Traducteur / Angel : entrées avec CE rôle uniquement
      filteredEntries = entries.filter(function(x) { return x.roles.indexOf(fRole) !== -1; });
      if (!filteredEntries.length) return;
    }

    results.push({ nom: nom, entries: filteredEntries });
  });

  // Trier alphabétiquement
  results.sort(function(a,b){ return a.nom.localeCompare(b.nom,'fr'); });

  document.getElementById('stats').innerHTML = '<span>'+results.length+'</span> ressource(s) affichée(s)';
  renderList(results);
}

var ROLE_CSS  = { animateur:'badge-f', helper:'badge-h', traducteur:'badge-t', angel:'badge-a', reunion:'badge-m' };
function ROLE_LBL_FN(r) {
  var map = { animateur:'mp_vue_animateur', helper:'mp_vue_helper', traducteur:'mp_vue_traducteur', angel:'mp_vue_angel' };
  return (typeof I18n!=='undefined' && map[r]) ? I18n.t(map[r]) : ({ animateur:'Animateur', helper:'Helper', traducteur:'Traducteur', angel:'Angel', reunion:'Réunion' }[r] || r);
}

function renderList(results) {
  var list = document.getElementById('resourceList');
  if (!results.length) {
    list.innerHTML = '<div class="empty">Aucun résultat pour ces filtres.</div>';
    return;
  }

  var fRole = currentVue;

  list.innerHTML = results.map(function(res, ri) {
    // Grouper par jour (sur les entries déjà filtrées par rôle)
    var byJour = new Map();
    res.entries.forEach(function(x) {
      var j = x.entry.jour;
      if (!byJour.has(j)) byJour.set(j, { jour:j, date:x.entry.date, entries:[] });
      byJour.get(j).entries.push(x);
    });

    // Trier les jours
    var jours = JOUR_ORDER.filter(function(j){ return byJour.has(j); }).map(function(j){ return byJour.get(j); });

    // Total ateliers + durée — calculés sur les entries filtrées
    // En vue rôle simple : somme directe des durées (pas de logique angel)
    // En vue combinée ou angel : logique calcDurJour / calcNbJour
    var totalAteliers;
    var totalMins;
    if (!fRole || fRole === 'angel') {
      totalAteliers = jours.reduce(function(s,g){ return s + calcNbJour(g.entries); }, 0);
      totalMins     = jours.reduce(function(s,g){ return s + calcDurJour(g.entries); }, 0);
    } else {
      // Pour Helper / Animateur / Traducteur / Colibri : somme simple des durées des entries filtrées
      totalAteliers = res.entries.length;
      totalMins = res.entries.reduce(function(s,x){ return s + (calcDuree(x.entry.heure)||0); }, 0);
    }

    // Rôles uniques de cette ressource (parmi les entries affichées)
    var rolesSet = new Set();
    res.entries.forEach(function(x){ x.roles.forEach(function(r){ rolesSet.add(r); }); });
    var rolesBadges = [...rolesSet].map(function(r) {
      var css = ROLE_CSS[r]||'badge-x';
      var lbl = ROLE_LBL_FN(r);
      return '<span class="badge '+css+'">'+lbl+'</span>';
    }).join('');

    // Badge COLIBRI : affiché uniquement si la personne est colibri ET a au moins
    // un atelier où son rôle est helper ou traducteur (pas animateur)
    var hasColibriRole = isColibri(res.nom) && res.entries.some(function(x) {
      return x.roles.indexOf('helper') !== -1 || x.roles.indexOf('traducteur') !== -1;
    });
    var colibriHtml = hasColibriRole
      ? '<span class="badge" style="background:#fff7ed;color:#c2410c;border:1px solid #fdba74;">Colibri</span>'
      : '';

    // Avatar initiale
    var initiale = res.nom.charAt(0).toUpperCase();

    // Lignes par jour
    var dayRows = jours.map(function(g, gi) {
      var rolesJour = new Set();
      g.entries.forEach(function(x){ x.roles.forEach(function(r){ rolesJour.add(r); }); });
      var rBadges = [...rolesJour].map(function(r){
        return '<span class="badge '+(ROLE_CSS[r]||'badge-x')+'">'+ROLE_LBL_FN(r)+'</span>';
      }).join('');

      // Badge Colibri au niveau du jour : si au moins 1 atelier du jour = helper/traducteur
      var hasColibriJour = isColibri(res.nom) && g.entries.some(function(x){
        return x.roles.indexOf('helper')!==-1 || x.roles.indexOf('traducteur')!==-1;
      });
      if (hasColibriJour) {
        rBadges += '<span class="badge" style="background:#fff7ed;color:#c2410c;border:1px solid #fdba74;">Colibri</span>';
      }

      // Durée jour : même logique que pour le total
      var durJour;
      if (!fRole || fRole === 'angel') {
        durJour = calcDurJour(g.entries);
      } else {
        durJour = g.entries.reduce(function(s,x){ return s + (calcDuree(x.entry.heure)||0); }, 0);
      }
      var nb = (!fRole || fRole === 'angel') ? calcNbJour(g.entries) : g.entries.length;

      // Intervalles des SHIFT ANGEL (pour le grisage des lignes couvertes)
      var angelIntervals = getAngelShiftIntervals(g.entries);

      function isAngelEntry(x) { return (x.entry.type||'').toUpperCase() === 'SHIFT ANGEL'; }
      function isCoveredByAngel(x) {
        if (!angelIntervals.length) return false;
        if (isAngelEntry(x)) return false; // le shift lui-même n'est pas grisé
        var m = String(x.entry.heure||'').replace(/\./g,':').replace(/[–—]/g,'-').match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
        if (!m) return false;
        var s=parseInt(m[1])*60+parseInt(m[2]), e=parseInt(m[3])*60+parseInt(m[4]);
        if (e<s) e+=1440;
        return angelIntervals.some(function(iv){ return s>=iv.s && e<=iv.e; });
      }

      // ── Tri et regroupement ──────────────────────────────────────────────────
      // Règle : ordre chronologique global.
      // Exception : un SHIFT ANGEL entraîne juste après lui, dans l'ordre chrono,
      // tous les ateliers couverts par ce shift (grisés).
      // Les ateliers couverts sont retirés de leur position naturelle.

      function entryStart(x) {
        return heureMin(String(x.entry.heure||'').replace(/[–—]/g,'-').split('-')[0].trim()) || 9999;
      }

      // Trouver le shift angel (s'il y en a) qui couvre une entrée donnée
      function shiftFor(x) {
        if (!angelIntervals.length) return null;
        var m = String(x.entry.heure||'').replace(/\./g,':').replace(/[–—]/g,'-').match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
        if (!m) return null;
        var s=parseInt(m[1])*60+parseInt(m[2]), e=parseInt(m[3])*60+parseInt(m[4]);
        if (e<s) e+=1440;
        for (var i=0; i<angelIntervals.length; i++) {
          if (s>=angelIntervals[i].s && e<=angelIntervals[i].e) return angelIntervals[i];
        }
        return null;
      }

      // Séparer : shifts, entrées couvertes (par shift), entrées libres
      var shiftEntries   = g.entries.filter(function(x){ return isAngelEntry(x); });
      var coveredEntries = g.entries.filter(function(x){ return !isAngelEntry(x) && shiftFor(x); });
      var freeEntries    = g.entries.filter(function(x){ return !isAngelEntry(x) && !shiftFor(x); });

      // Trier shifts et libres chronologiquement
      shiftEntries.sort(function(a,b){ return entryStart(a)-entryStart(b); });
      freeEntries.sort(function(a,b){  return entryStart(a)-entryStart(b); });

      // Construire la séquence finale :
      // Mélanger shifts et libres dans l'ordre chrono ; après chaque shift, insérer ses couverts
      var sequence = [];
      var usedShiftIdxs = [];

      // Tous les "points de départ" : shifts + libres, triés
      var anchors = shiftEntries.concat(freeEntries).sort(function(a,b){ return entryStart(a)-entryStart(b); });
      anchors.forEach(function(x) {
        sequence.push({ x:x, covered:false });
        if (isAngelEntry(x)) {
          // Chercher le shift interval correspondant
          var m = String(x.entry.heure||'').replace(/\./g,':').replace(/[–—]/g,'-').match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
          if (m) {
            var ss=parseInt(m[1])*60+parseInt(m[2]), se=parseInt(m[3])*60+parseInt(m[4]);
            if (se<ss) se+=1440;
            // Insérer les ateliers couverts par CE shift, triés chrono
            var kids = coveredEntries.filter(function(c){
              var cm = String(c.entry.heure||'').replace(/\./g,':').replace(/[–—]/g,'-').match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
              if (!cm) return false;
              var cs=parseInt(cm[1])*60+parseInt(cm[2]), ce=parseInt(cm[3])*60+parseInt(cm[4]);
              if (ce<cs) ce+=1440;
              return cs>=ss && ce<=se;
            }).sort(function(a,b){ return entryStart(a)-entryStart(b); });
            kids.forEach(function(c){ sequence.push({ x:c, covered:true }); });
          }
        }
      });

      // Génère un ID stable pour un shift (basé sur l'index dans AGENDA)
      function shiftGroupId(shiftEntry) {
        return 'sg-'+ri+'-'+gi+'-'+AGENDA.indexOf(shiftEntry.entry);
      }

      // Fonction de rendu d'une ligne
      function renderRow(x, covered, groupId) {
        var e = x.entry;
        var isShift = isAngelEntry(x);
        var dur = calcDuree(e.heure);
        var langBadge = (e.traduction || isBilingue(e.fac1) || isBilingue(e.fac2) || isBilingue(e.fac3) || isBilingue(e.fac4))
          ? '<span class="badge badge-lang badge-en">FR/EN</span>'
          : '<span class="badge badge-lang badge-fr">FR</span>';
        var facs = [e.fac1,e.fac2,e.fac3,e.fac4].filter(Boolean).join(' & ');
        var pm = parseInt(e.piment)||0;
        var roleBadge = x.roles.map(function(r){
          return '<span class="badge '+(ROLE_CSS[r]||'badge-x')+'">'+ROLE_LBL_FN(r)+'</span>';
        }).join('');
        var agendaIdx = AGENDA.indexOf(e);

        // Pill de durée + nombre ateliers couverts + chevron pour la ligne shift
        var shiftDurPill = '';
        if (isShift) {
          var nbCovered = 0;
          if (groupId) {
            // Compter les enfants de ce shift
            sequence.forEach(function(item) {
              if (item.covered && item.parentGroupId === groupId) nbCovered++;
            });
          }
          shiftDurPill = (dur ? '<span class="angel-shift-dur-pill">'+fmtDuree(dur)+'</span>' : '') +
            (nbCovered > 0 ? '<span style="display:inline-block;font-size:10px;font-weight:600;color:var(--badge-a-tx);margin-left:6px;opacity:.8;">'+nbCovered+' atelier'+(nbCovered>1?'s':'')+'</span>' : '') +
            '<span class="shift-chevron">›</span>';
        }

        // Classe de ligne selon type
        var rowClass, rowAttrs;
        if (isShift) {
          rowClass = 'angel-shift-row';
          // Clic sur la ligne shift → toggle groupe couvert (pas ouverture modale)
          rowAttrs = ' class="'+rowClass+'" data-shift-group="'+(groupId||'')+'" style="cursor:pointer"'+
            ' onclick="toggleAngelShift(this)"';
        } else if (covered) {
          rowClass = 'angel-covered-row';
          rowAttrs = ' class="'+rowClass+'" data-shift-member="'+(groupId||'')+'" style="cursor:pointer"'+
            ' onclick="openDetail('+agendaIdx+',\''+ri+'\')"';
        } else {
          rowClass = '';
          rowAttrs = ' style="cursor:pointer" onclick="openDetail('+agendaIdx+',\''+ri+'\')"';
        }

        return '<tr'+rowAttrs+'>'+
          '<td style="width:32px;padding:4px 6px;" onclick="event.stopPropagation()"><button class="info-btn" title="Détails" onclick="openDetail('+agendaIdx+',\''+ri+'\')">ℹ️</button></td>'+
          '<td class="at-heure">'+esc(e.heure||'—')+'</td>'+
          '<td class="at-duree">'+((!isShift && dur) ? fmtDuree(dur) : (isShift ? '' : '—'))+'</td>'+
          '<td>'+roleBadge+'</td>'+
          '<td class="at-name">'+esc(e.atelier||'—')+shiftDurPill+
            (pm?'<span style="margin-left:4px;font-size:11px">'+pimentHtml(pm)+'</span>':'')+
            (isColibri(res.nom) && (x.roles.indexOf('helper')!==-1 || x.roles.indexOf('traducteur')!==-1) ? '<span class="badge" style="margin-left:5px;background:#fff7ed;color:#c2410c;border:1px solid #fdba74;font-size:9px;">Colibri</span>' : '')+
          '</td>'+
          '<td>'+lieuLabel(e.lieu)+'</td>'+
          '<td>'+esc(facs||'—')+'</td>'+
          '<td>'+langBadge+'</td>'+
          '<td>'+(e.note?'<span style="font-size:11px;color:#d97706">'+esc(e.note)+'</span>':'')+'</td>'+
        '</tr>';
      }

      // Enrichir la séquence avec parentGroupId sur les entrées couvertes
      (function() {
        var currentShiftGroupId = null;
        sequence.forEach(function(item) {
          if (isAngelEntry(item.x)) {
            currentShiftGroupId = shiftGroupId(item.x);
            item.groupId = currentShiftGroupId;
          } else if (item.covered) {
            item.parentGroupId = currentShiftGroupId;
          }
        });
      })();

      var tableRows = sequence.map(function(item) {
        var gid = item.groupId || item.parentGroupId || null;
        return renderRow(item.x, item.covered, gid);
      }).join('');

      var tableId = 'tbl-'+ri+'-'+gi;
      return '<div class="day-row" id="drow-'+ri+'-'+gi+'" onclick="toggleDay(\''+ri+'\',\''+gi+'\')">' +
          '<span class="day-label">'+esc(g.jour)+'</span>' +
          '<span class="day-date">'+esc(g.date)+'</span>' +
          '<span class="day-roles">'+rBadges+'</span>' +
          '<span class="day-meta"><span>'+fmtDuree(durJour)+'</span>&nbsp;·&nbsp;<strong>'+nb+'</strong>&nbsp;<span style="font-weight:400">'+I18n.t(nb>1?'rp_ateliers_s':'rp_atelier_s')+'</span></span>' +
          '<span class="day-chevron">›</span>' +
        '</div>' +
        '<div id="'+tableId+'" style="display:none">' +
          '<div class="ateliers-wrap">' +
            '<table class="ateliers-table">' +
              '<thead><tr>' +
                '<th></th><th>Heure</th><th>Durée</th><th>Rôle</th><th>Atelier</th><th>Lieu</th><th>Animateur(s)</th><th>Lang.</th><th>Note</th>' +
              '</tr></thead>' +
              '<tbody>'+tableRows+'</tbody>' +
            '</table>' +
          '</div>' +
        '</div>';
    }).join('');

    return '<div class="resource-card" id="rcard-'+ri+'">' +
      '<div class="resource-header" onclick="toggleResource('+ri+')">' +
        '<div class="resource-avatar">'+esc(initiale)+'</div>' +
        '<span class="resource-name-wrap">' +
          '<span class="resource-name">'+esc(res.nom)+'</span>' +
          '<span class="resource-badges">'+rolesBadges+(colibriHtml ? colibriHtml : '')+'</span>' +
        '</span>' +
        '<span class="resource-stats" style="font-weight:700">'+fmtDuree(totalMins)+' · '+totalAteliers+' <span style="font-weight:400">'+I18n.t(totalAteliers>1?'rp_ateliers_s':'rp_atelier_s')+'</span></span>' +
        '<span class="resource-chevron">›</span>' +
      '</div>' +
      '<div class="resource-body">'+dayRows+'</div>' +
    '</div>';
  }).join('');
}

window.toggleResource = function(ri) {
  var card = document.getElementById('rcard-'+ri);
  if (card) card.classList.toggle('open');
};

// Toggle les ateliers couverts sous un shift angel
window.toggleAngelShift = function(shiftRow) {
  var groupId = shiftRow.getAttribute('data-shift-group');
  if (!groupId) return;
  var isOpen = shiftRow.classList.contains('shift-open');
  shiftRow.classList.toggle('shift-open', !isOpen);
  // Trouver le tableau parent et basculer toutes les lignes membres
  var tbody = shiftRow.closest('tbody');
  if (!tbody) return;
  tbody.querySelectorAll('[data-shift-member="'+groupId+'"]').forEach(function(row) {
    row.classList.toggle('shift-visible', !isOpen);
  });
};

window.toggleDay = function(ri, gi) {
  var row = document.getElementById('drow-'+ri+'-'+gi);
  var tbl = document.getElementById('tbl-'+ri+'-'+gi);
  if (!row || !tbl) return;
  var open = tbl.style.display !== 'none';
  tbl.style.display = open ? 'none' : 'block';
  row.classList.toggle('open', !open);
};

// MODALE DÉTAIL
// ════════════════════════════════════════════
var _modalLang = 'fr';
var _modalEntry = null;

window.setModalLang = function(lang) {
  _modalLang = lang;
  document.getElementById('mlBtnFr').classList.toggle('active', lang==='fr');
  document.getElementById('mlBtnEn').classList.toggle('active', lang==='en');
  // Mettre à jour le sous-titre (jour + date) selon la nouvelle langue
  if (_modalEntry) {
    document.getElementById('mSub').textContent = jourSubtitle(_modalEntry.jour, lang);
  }
  renderModalBody();
};

window.openDetail = function(agendaIdx, ri) {
  var e = AGENDA[agendaIdx];
  if (!e) return;
  _modalEntry = e;
  _modalLang = (typeof I18n!=='undefined') ? I18n.getLang() : 'fr';
  document.getElementById('mlBtnFr').classList.toggle('active', _modalLang==='fr');
  document.getElementById('mlBtnEn').classList.toggle('active', _modalLang==='en');

  var pm = parseInt(e.piment)||0;
  document.getElementById('mTitle').innerHTML = esc(e.atelier||'—') + (pm ? ' '+pimentHtml(pm) : '');
  document.getElementById('mSub').textContent = jourSubtitle(e.jour, _modalLang);

  renderModalBody();
  document.getElementById('detailModal').classList.add('open');
  document.body.style.overflow = 'hidden';
};

window.closeModal = function() {
  document.getElementById('detailModal').classList.remove('open');
  document.body.style.overflow = '';
};
window.closeModalOnOverlay = function(ev) {
  if (ev.target === document.getElementById('detailModal')) closeModal();
};
document.addEventListener('keydown', function(ev) {
  if (ev.key==='Escape') closeModal();
});

// ── Swipe horizontal sur la modal (mobile) → fermer ──────────────────────────
(function() {
  var box = document.getElementById('detailBox');
  var startX = 0, startY = 0;

  box.addEventListener('touchstart', function(ev) {
    startX = ev.touches[0].clientX;
    startY = ev.touches[0].clientY;
  }, { passive: true });

  box.addEventListener('touchend', function(ev) {
    var dx = ev.changedTouches[0].clientX - startX;
    var dy = ev.changedTouches[0].clientY - startY;
    // Swipe horizontal > 60px ET plus horizontal que vertical → fermer
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) {
      closeModal();
    }
  }, { passive: true });
})();

  // ── Section 1 : Infos générales ─────────────────────────────────────────
  var rows1 = [];

  rows1.push(['🕐 '+(lang==='en'?'Schedule':'Horaire'), horaireVal]);
  if (arrivee) rows1.push(['⏰ '+(lang==='en'?'Arrive at':'Arrivée'), '<strong style="color:#dc2626">'+arrivee+'</strong>']);
  rows1.push(['📍 '+(lang==='en'?'Venue':'Lieu'), e.lieu ? lieuLabel(e.lieu) : '—']);
  rows1.push(['🎓 '+(lang==='en'?'Teacher(s)':'Animateur(s)'), facs.length ? facs.map(esc).join(' &amp; ') : '—']);
  rows1.push(['🙌 '+(lang==='en'?'Helper(s)':'Helper(s)'), helpers.length ? helpers.map(esc).join(', ') : '—']);
  rows1.push(['🌐 '+(lang==='en'?'Translator':'Traducteur'), e.traduction ? esc(e.traduction) : '—']);
  rows1.push(['👼 Angel', angelWithPhone(e.angel)]);
  rows1.push(['🏷 Note', noteVal ? esc(noteVal) : '—']);

  var gridHtml1 = rows1.map(function(r){
    return '<div class="modal-lbl">'+r[0]+'</div><div class="modal-val">'+r[1]+'</div>';
  }).join('');

  var noTxt = lang==='en' ? '<span class="no-content">—</span>' : '<span class="no-content">—</span>';
  var dark = document.body.classList.contains('dark');

  // Description + consigne (toujours affichées)
  var descTxt = (lang==='en' && desc && desc.descEn && desc.descEn.trim())
    ? desc.descEn : (desc && desc.descFr && desc.descFr.trim() ? desc.descFr : '');
  var consigneTxt = (lang==='en' && desc && desc.consigneEn && desc.consigneEn.trim())
    ? desc.consigneEn : (desc && desc.consigne && desc.consigne.trim() ? desc.consigne : '');
  var consigneLabel = lang==='en' ? '⚠️ Participant instructions' : '⚠️ Instructions participants';

  // ── Consignes type actives pour cet atelier ──────────────────────────────
  var _disabled = e._consignesDisabled || {};
  function _consignesTypeBlock(placement) {
    if (typeof REF_CONSIGNES_TYPE === 'undefined') return '';
    var items = REF_CONSIGNES_TYPE.filter(function(c) {
      if (c.actif === false) return false;
      if (_disabled[c.id]) return false;
      if (!c.placements || c.placements.indexOf(placement) === -1) return false;
      if (c.types && c.types.length > 0 && e.type && c.types.indexOf(e.type) === -1) return false;
      return true;
    });
    if (!items.length) return '';
    var html = '';
    items.forEach(function(c) {
      var txt = (lang==='en' && c.valueEn && c.valueEn.trim()) ? c.valueEn : c.valueFr;
      if (txt) html += esc(txt).replace(/\n/g,'<br>') + '<br>';
    });
    return html ? '<span>' + html + '</span>' : '';
  }

  // ── Consignes récurrentes sélectionnées pour cet atelier ─────────────────
  var _corecSel = e._corecSelected || {};
  function _consignesRecurrentesBlock(placement) {
    if (typeof REF_CONSIGNES_RECURRENTES === 'undefined') return '';
    var selectedIds = (_corecSel[placement] || []);
    if (!selectedIds.length) return '';
    var items = REF_CONSIGNES_RECURRENTES.filter(function(c) {
      return c.actif !== false && selectedIds.indexOf(c.id) !== -1;
    });
    if (!items.length) return '';
    var html = '';
    items.forEach(function(c) {
      var txt = (lang==='en' && c.valueEn && c.valueEn.trim()) ? c.valueEn : c.valueFr;
      if (txt) html += esc(txt).replace(/\n/g,'<br>') + '<br>';

    return html ? '<span>' + html + '</span>' : '';

  // ── Palettes blocs (identiques à Saisie Ateliers) ───────────────────────

  var S_INFO   = dark

  // Vert   : LOGISTIQUE

    : 'background:#f0fdf4;border:2px solid #4ade80;border-radius:12px;padding:16px 18px;margin-bottom:0';
  var S_LOG_TL   = dark ? 'color:#4ade80' : 'color:#166534';
  // Violet : BESOINS SPÉCIFIQUES
  var S_SPEC   = dark
    ? 'background:#1a0533;border:2px solid #9333ea;border-radius:12px;padding:16px 18px;margin-bottom:0'
    : 'background:#faf5ff;border:2px solid #c084fc;border-radius:12px;padding:16px 18px;margin-bottom:0';
  var S_SPEC_TL  = dark ? 'color:#c084fc' : 'color:#7e22ce';

    : 'background:#f0fdfa;border:2px solid #2dd4bf;border-radius:12px;padding:16px 18px;margin-bottom:0';
  var S_EQ_TL    = dark ? 'color:#2dd4bf' : 'color:#0f766e';
  // Bleu   : CONSIGNES HELPERS
  var S_HELP   = dark
    ? 'background:#0c1a40;border:2px solid #2563eb;border-radius:12px;padding:16px 18px;margin-bottom:0'
    : 'background:#eff6ff;border:2px solid #3b82f6;border-radius:12px;padding:16px 18px;margin-bottom:0';
  var S_HELP_TL  = dark ? 'color:#60a5fa' : 'color:#1d4ed8';

  var titleStyle = 'font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;padding-bottom:8px;margin-bottom:14px;border-bottom:2px solid;';

  // ── Bloc 1) INFORMATIONS GÉNÉRALES (jaune) — inclut description atelier ──
  var sec1 = '<div style="'+S_INFO+'">'+
    '<div style="'+titleStyle+S_INFO_TL+';border-bottom-color:'+(dark?'#92400e':'#fde68a')+'">'+

    : '<span class="validated-badge validated-no">&#8987; '+(lang==='en'?'Not yet validated':'Non encore validé')+'</span>';

  var updatedAt = logE && logE.updatedAt ? logE.updatedAt : (logH && logH.updatedAt ? logH.updatedAt : '');

  var avantTxt   = logH && logH.avant   && logH.avant.trim().replace(/<[^>]*>/g,'').trim()   ? logH.avant   : '';
  var pendantTxt = logH && logH.pendant && logH.pendant.trim().replace(/<[^>]*>/g,'').trim() ? logH.pendant : '';
  var apresTxt   = logH && logH.apres   && logH.apres.trim().replace(/<[^>]*>/g,'').trim()   ? logH.apres   : '';

  var logSpecTxt = logS && logS.html && logS.html.trim().replace(/<[^>]*>/g,'').trim() ? logS.html : '';

    '<div class="modal-grid" style="margin-bottom:10px">'+

      '<div class="modal-val" style="white-space:nowrap">'+prepVal+'</div>'+

    '<div style="display:flex;flex-direction:column;gap:8px;">'+
      '<div class="modal-desc-box">'+
        '<div class="modal-desc-lbl">'+(lang==='en'?'Logistics info':'Informations logistiques')+'</div>'+
        _consignesRecurrentesBlock('Logistique')+
        _consignesTypeBlock('Logistique')+
        '<div>'+(logInfoTxt ? logInfoTxt : noTxt)+'</div>'+
      '</div>'+
    '</div>'+
  '</div>';

  // ── Bloc 3) BESOINS LOGISTIQUES SPÉCIFIQUES (violet) ─────────────────────
  var sec_spec = '<div style="'+S_SPEC+'">'+
    '<div style="'+titleStyle+S_SPEC_TL+';border-bottom-color:'+(dark?'#9333ea':'#c084fc')+'">'+
      '3) '+(lang==='en'?'Specific logistics needs':'Besoins logistiques spécifiques')+
    '</div>'+
    _consignesRecurrentesBlock('Spécifique')+
    _consignesTypeBlock('Spécifique')+
    '<div>'+(logSpecTxt ? logSpecTxt : noTxt)+'</div>'+
  '</div>';

  // ── Bloc 4) ÉQUIPEMENTS (teal) ───────────────────────────────────────────
  var eqAgenda  = e._equipements || {};
  var eqLogist  = (logId && logE && logE._equipements) || {};
  var eqAll     = Object.assign({}, eqLogist, eqAgenda); // AGENDA prime
  var eqKeys    = Object.keys(eqAll).filter(function(k){ return eqAll[k] > 0; });

  var sec_eq;
  if (!eqKeys.length) {
    sec_eq = '<div style="'+S_EQ+'">'+
      '<div style="'+titleStyle+S_EQ_TL+';border-bottom-color:'+(dark?'#0d9488':'#2dd4bf')+'">'+
        '4) '+(lang==='en'?'Equipment':'Équipements')+
      '</div>'+
      '<span style="font-size:13px;color:var(--muted)">—</span>'+
    '</div>';
  } else {
    // Regrouper par type puis par catégorie
    var TYPE_LABELS = { 'Hameau': 'Stock Hameau', 'Tantramour': 'Stock Tantramour', 'Animateur': 'Apporté par animateur', 'Autre': 'Autre', 'NEW': 'Nouveau' };
    var TYPE_ORDER  = ['Hameau', 'Tantramour', 'Animateur', 'NEW', 'Autre'];
    var CAT_ORDER   = ['Animation','Pratique','Ambiance & décoration','Hygiène & entretien','Consommables & fournitures','Mobilier & aménagement','Cuisine','Divers'];
    var byType = {};
    eqKeys.forEach(function(eqId) {
      var ref = (typeof REF_EQUIPEMENTS !== 'undefined') ? REF_EQUIPEMENTS.find(function(r){ return r.id === eqId; }) : null;
      var type = (ref && ref.type) || 'Autre';
      var cat  = (ref && ref.categorie) || 'Divers';
      var nom  = (ref && ref.value) || eqId;
      if (!byType[type]) byType[type] = {};
      if (!byType[type][cat]) byType[type][cat] = [];
      byType[type][cat].push(nom + ' (' + eqAll[eqId] + ')');
    });
    var html = '';
    TYPE_ORDER.forEach(function(type) {
      if (!byType[type]) return;
      html += '<div style="margin-bottom:10px;">';
      html += '<div style="font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:'+(dark?'#2dd4bf':'#0f766e')+';margin-bottom:6px;">'+(TYPE_LABELS[type]||type)+' :</div>';
      // Catégories dans l'ordre défini, puis les inconnues à la fin
      var cats = CAT_ORDER.filter(function(c){ return byType[type][c]; })
        .concat(Object.keys(byType[type]).filter(function(c){ return CAT_ORDER.indexOf(c) === -1; }).sort());
      cats.forEach(function(cat) {
        html += '<div style="margin-left:8px;margin-bottom:4px;">';
        html += '<span style="font-size:12px;font-weight:600;color:var(--text)">• '+(cat||'—')+' : </span>';
        html += '<span style="font-size:13px;color:var(--text)">'+byType[type][cat].join(' ; ')+'</span>';
        html += '</div>';
      });
      html += '</div>';
    });
    sec_eq = '<div style="'+S_EQ+'">'+
      '<div style="'+titleStyle+S_EQ_TL+';border-bottom-color:'+(dark?'#0d9488':'#2dd4bf')+'">'+
        '4) '+(lang==='en'?'Equipment':'Équipements')+
      '</div>'+
      html+
    '</div>';
  }

  // ── Bloc 5) CONSIGNES HELPERS (bleu foncé) ───────────────────────────────
  var sec_help = '<div style="'+S_HELP+'">'+
    '<div style="'+titleStyle+S_HELP_TL+';border-bottom-color:'+(dark?'#2563eb':'#3b82f6')+'">'+
      '5) '+(lang==='en'?'Helper instructions':'Consignes helpers')+
    '</div>'+
    '<div style="display:flex;flex-direction:column;gap:8px;">'+
      '<div class="modal-desc-box">'+
        '<div class="modal-desc-lbl">'+(lang==='en'?'To do before':'À faire avant')+'</div>'+
        _consignesTypeBlock('Avant')+
        _consignesRecurrentesBlock('Avant')+
        '<div>'+(avantTxt ? avantTxt : noTxt)+'</div>'+
      '</div>'+
      '<div class="modal-desc-box">'+
        '<div class="modal-desc-lbl">'+(lang==='en'?'To do during':'À faire pendant')+'</div>'+
        _consignesTypeBlock('Pendant')+
        _consignesRecurrentesBlock('Pendant')+
        '<div>'+(pendantTxt ? pendantTxt : noTxt)+'</div>'+
      '</div>'+
      '<div class="modal-desc-box">'+
        '<div class="modal-desc-lbl">'+(lang==='en'?'To do after':'À faire après')+'</div>'+
        (range > 0 ? '<div style="display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:3px 8px;margin-bottom:6px;">🧹 '+(lang==='en'?'Tidying up':'Rangement')+' : <strong style="color:var(--text)">'+range+' min</strong></div>' : '')+
        _consignesTypeBlock('Après')+
        _consignesRecurrentesBlock('Après')+
        '<div>'+(apresTxt ? apresTxt : noTxt)+'</div>'+
      '</div>'+
    '</div>'+
  '</div>';

  // ── Pied de popup : Validé par animateur + Dernière modification ──────────
  var sec_footer =
    '<div style="padding:10px 4px 2px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:4px;">'+
      validBadge+
      '<div style="font-size:11px;color:var(--muted)">'+(lang==='en'?'Last updated':'Dernière modification')+' : '+(updatedAt ? esc(updatedAt) : '—')+'</div>'+
    '</div>';

  document.getElementById('mBody').innerHTML =
    '<div style="display:flex;flex-direction:column;gap:14px">'+
      sec1 + sec_log + sec_spec + sec_eq + sec_help + sec_footer +
    '</div>';
}

// ════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════
applyFilters();

if (typeof I18n !== 'undefined') {
  I18n.renderToggleBtn('headerActions', 'btn');
  document.addEventListener('tm_lang_changed', function() {
    // Traduire le label et les options du filtre Vue
    updateVueFilterLabels();

    // Mémoriser quelles cartes et quels jours sont ouverts
    var openCards = [];
    var openDays  = {};
    document.querySelectorAll('.resource-card').forEach(function(card, ri) {
      if (card.classList.contains('open')) openCards.push(ri);
    });
    document.querySelectorAll('[id^="tbl-"]').forEach(function(el) {
      if (el.style.display !== 'none') openDays[el.id] = true;
    });

    // Re-rendre la liste complète
    applyFilters();

    // Restaurer l'état ouvert des cartes
    openCards.forEach(function(ri) {
      var card = document.getElementById('rcard-'+ri);
      if (card) card.classList.add('open');
    });
    // Restaurer l'état ouvert des tables jour
    Object.keys(openDays).forEach(function(id) {
      var tbl  = document.getElementById(id);
      var parts = id.split('-'); // tbl-ri-gi
      var rowId = 'drow-'+parts[1]+'-'+parts[2];
      var row   = document.getElementById(rowId);
      if (tbl)  tbl.style.display  = 'block';
      if (row)  row.classList.add('open');
    });

    var modeBtn = document.getElementById('modeBtn');
    if (modeBtn) modeBtn.textContent = document.body.classList.contains('dark') ? '☀️ Mode Jour' : '🌙 Mode Nuit';
  });
}

// Traduit les tabs Vue + labels filtres selon la langue active
function updateVueFilterLabels() {
  // Titre "Mon Planning V2"
  var titleEl = document.querySelector('.logo p[data-i18n="mp_title"]');
  if (titleEl) titleEl.textContent = '📋 ' + I18n.t('mp_title');
  // Label "Nom"
  var lblNom = document.getElementById('lbl-fNom');
  if (lblNom) lblNom.textContent = I18n.t('mp_lbl_nom');
  // Label "Recherche nom" + placeholder
  var lblSearch = document.getElementById('lbl-fSearch');
  if (lblSearch) lblSearch.textContent = I18n.t('mp_lbl_search');
  var fSearchEl = document.getElementById('fSearch');
  if (fSearchEl) fSearchEl.placeholder = I18n.t('mp_search_ph');
  // Option "Aucun" du select Nom
  var optAucun = document.querySelector('#fNom option[data-i18n="mp_opt_aucun"]');
  if (optAucun) optAucun.textContent = I18n.t('mp_opt_aucun');
  // Label "Vue :"
  var tabsLbl = document.querySelector('.vue-tabs-lbl[data-i18n="mp_vue_label"]');
  if (tabsLbl) tabsLbl.textContent = I18n.t('mp_vue_label') + ' :';
  // Texte des boutons tabs
  document.querySelectorAll('#vueTabs .vtab[data-i18n]').forEach(function(btn) {
    btn.textContent = I18n.t(btn.getAttribute('data-i18n'));
  });
  // Bouton Mode Nuit/Jour
  var modeBtn = document.getElementById('modeBtn');
  if (modeBtn) {
    var isDark = document.body.classList.contains('dark');
    modeBtn.textContent = isDark ? I18n.t('mp_mode_jour') : I18n.t('mp_mode_nuit');
  }
}
// Appel initial
updateVueFilterLabels();

function toggleMode() {
  var dark = document.body.classList.toggle('dark');
  var btn  = document.getElementById('modeBtn');
  if (btn) btn.textContent = dark ? I18n.t('mp_mode_jour') : I18n.t('mp_mode_nuit');
}
window.toggleMode = toggleMode;

function hardReload() {
  if ('caches' in window) {
    caches.keys().then(function(k){ return Promise.all(k.map(function(x){ return caches.delete(x); })); })
      .finally(function(){ location.reload(true); });
  } else { location.reload(true); }
}
window.hardReload = hardReload;

}); // fin loadData
</script>
